# Atelier assembly transforms
#
# The source STLs (manual/models/*.stl) are each oriented for 3D printing,
# per PRINT_NOTES.md, not for the assembled product. This file records how
# each part is rotated and translated to rebuild the real, right-way-up
# assembly for illustration purposes.
#
# Confidence per part:
#   body, nose_cone, collar, foot   -> derived from the mesh geometry itself
#                                       (joint rim radii, taper direction,
#                                       print-note orientation). High confidence.
#   grille, bezel, knob, LED        -> position derived from real openings
#                                       found on body.stl's front face (see
#                                       scripts/find_front_holes.py and the
#                                       comment above the grille entry below).
#                                       Not fitted_by_eye. Their own PART
#                                       geometry (the grille/bezel/knob STL
#                                       shapes) still has no verified source.
#   fin_x3                          -> root mesh-derived (mounting pilot
#                                       holes), tip photo-derived (no
#                                       matching hole for the outward reach).
#                                       fitted_by_eye: true.
#
# Transform order per part: rotate (about local origin) THEN translate.
# Rotations are 90-degree-multiple axis rotations only, so no precision is
# lost. All units mm, all angles degrees.
#
# World frame: Z up (assembled product height), Y = "front" (the direction
# the grille faces, matching the reference photo), X = left/right.

parts:
  body:
    file: body.stl
    rotate: {axis: Y, deg: 180}
    translate: [0, 0, 209.1]
    note: >
      Printed upside down (cone-joint rim on the bed). Flipping 180 deg about
      Y puts the nose joint back on top and the collar joint back on the
      bottom, and keeps the grille recess (found centred on +Y in the raw
      mesh) facing +Y.

  nose_cone:
    file: nose_cone.stl
    rotate: {axis: NONE, deg: 0}
    translate: [0, 0, 206.1]
    note: >
      Printed upright already (spigot on the bed = spigot down = correct for
      assembly, spigot inserts down into the body). Stacked on the body's top
      joint (world Z 209.1) with a 3 mm estimated insertion overlap.

  collar:
    file: collar.stl
    rotate: {axis: Y, deg: 180}
    translate: [0, 0, 0]
    note: >
      Printed upside down (spigot on the bed). Flipped 180 deg about Y so the
      spigot (mates to the body's underside) sits at world Z 0, cup and port
      recess hang below.

  foot:
    file: foot.stl
    rotate: {axis: Y, deg: 180}
    translate: [0, 0, -19.8]
    note: >
      Printed upside down (flat top on the bed). Flipped so the flat top
      glues to the underside of the collar cup (world Z -19.8), rounded tip
      down.

  # --- grille / bezel / knob / LED: mesh-derived, not fitted_by_eye --------
  # No CAD/generator source for these parts' own GEOMETRY was found
  # (searched: this repo's full git history, all branches, the uploaded file
  # set, the container filesystem) -- the grille/bezel/knob STL shapes
  # themselves still have no verified source. Their POSITIONS, though, are
  # now derived directly and rigorously from body.stl, not fitted: see
  # scripts/find_front_holes.py, which ray-casts along the body's front
  # centreline (from far +Y toward -Y) and records every stretch where the
  # front face has no material -- i.e. every real opening, found from the
  # actual triangulated surface rather than from vertex density.
  #
  # This corrects an earlier mistake, caught by Ido independently measuring
  # body.stl himself: a first pass (refit_from_mesh.py's vertex-cluster
  # method) misidentified a noisy cluster at file_z ~101-110 as "the knob
  # hole". That cluster had a much higher std (4.6-5.0) than every genuine
  # hole found the same way (LED: std 0.01, bezel screw holes: std
  # 0.19-0.40) -- a red flag that should have been caught at the time. It
  # was actually boundary artefacts from the grille recess's own edge
  # (which closes at file_z 97.5, right next to it), not a hole at all. The
  # real knob hole is 30mm further round the taper, confirmed by a full
  # centreline sweep with find_front_holes.py:
  #
  #   grille/bezel opening: file_z 48.5-97.5, centre 73.0  -> world_z 136.1
  #   LED hole (dia. ~2mm):  file_z 119.5-122.5, centre 121.0 -> world_z 88.1
  #   knob hole (dia. ~10mm): file_z 132.5-143.0, centre 137.75 -> world_z 71.35
  #
  # All three centres are within a fraction of a mm of Ido's own independent
  # measurement of body.stl (grille 73, LED 121, knob 137.5). The knob's
  # mounting hole is well clear of the grille/bezel opening -- see
  # scripts/measure_knob_gap.py for the resulting gap, no overlap.

  grille:
    file: grille.stl
    rotate: {axis: NONE, deg: 0}
    translate: [0, 40.4, 99.2]
    note: >
      Z from the real recess opening in body.stl (world_z 136.1, see above)
      -- was 99.4 (world 136.3) from the old, less precise mounting-hole-
      rectangle estimate; the 0.2mm difference is noise, not a correction.
      Y (front face at 50) is a clearance choice, not a hole measurement:
      the recess itself is a tapered dish (its rim reads ~28-31mm radius,
      narrower than the body's ~44-48mm baseline), so there's no single
      "true" Y for a flat front face to sit at -- Y 50 simply clears the
      body's max surface radius (48.4mm) everywhere, avoiding the
      hidden-line test wrongly hiding the part behind the taper.

  bezel:
    file: bezel.stl
    rotate: {axis: NONE, deg: 0}
    translate: [0, 40.5, 96.2]
    note: >
      Z from the same real recess opening as grille (world_z 136.1). Y
      (front face at 52) clear of the body's max surface radius, same basis
      as grille.

  knob:
    file: knob.stl
    rotate: {axis: X, deg: 90}
    translate: [0, 50, 71.35]
    note: >
      Z from body.stl's real knob mounting hole (world_z 71.35, dia. ~10mm)
      -- see the note above on how the earlier Z 103.3 was a misidentified
      cluster. Y (front face at 50) clear of the body's real surface radius
      here (47.9mm). Printed front-face-down/shaft-bore-up, so the 90 deg
      rotation about X brings the decorative face back to +Y.

  fin_1:
    file: fin_x3.stl
    fitted_by_eye: true
    matrix4:
      - [0.000035, 0.000128, 1.000000, -3.995536]
      - [0.982060, 0.188571, -0.000058, -70.043501]
      - [-0.188571, 0.982060, -0.000119, 0.288473]
      - [0.0, 0.0, 0.0, 1.0]
    note: >
      Root mesh-derived, tip photo-derived. Azimuth 180 deg (directly behind
      the body, hidden from the front view). body.stl has its own fin
      mounting pilot holes (2 per side, ~1.6mm radius, matching the 3.3mm
      pilot holes in PRINT_NOTES.md) at world radius 40.3mm, Z 36.6 -- this
      replaces the original photo estimate (r 47.9, Z 80) with the real
      attachment point. No corresponding hole exists for the OUTER tip (it's
      off the body entirely), so the tip stays photo-derived: Z -22, r 68.9
      (measured fin-tip footprint, 137.8mm tip-to-tip / 2). The rotation
      itself is computed (scripts/refit_from_mesh.py), not hand-tilted.

  fin_2:
    file: fin_x3.stl
    fitted_by_eye: true
    matrix4:
      - [-0.850506, -0.163371, -0.499950, 62.657219]
      - [-0.491000, -0.094174, 0.866055, 31.561514]
      - [-0.188571, 0.982060, -0.000119, 0.288473]
      - [0.0, 0.0, 0.0, 1.0]
    note: "Root mesh-derived, tip photo-derived. Azimuth 60 deg. See fin_1 for method. Visible at right in front view."

  fin_3:
    file: fin_x3.stl
    fitted_by_eye: true
    matrix4:
      - [0.850471, 0.163243, -0.500050, -58.661683]
      - [-0.491060, -0.094396, -0.865996, 38.481986]
      - [-0.188571, 0.982060, -0.000119, 0.288473]
      - [0.0, 0.0, 0.0, 1.0]
    note: "Root mesh-derived, tip photo-derived. Azimuth -60 deg. See fin_1 for method. Visible at left in front view."

markers:
  # Not a mesh -- the LED is a small surface feature drawn as a simple
  # circle.
  led:
    file: null
    world_position: [0, 49.0, 88.1]
    radius_mm: 1.5
    note: >
      Mesh-derived, not fitted: body.stl has a real ~2mm-diameter hole at
      world_z 88.1 (file_z 121.0, see find_front_holes.py), sitting cleanly
      between the knob (top edge world_z ~80.35) and the bezel (bottom edge
      world_z ~96.2) -- "LED above the knob", confirmed by the mesh rather
      than placed to satisfy it. An earlier pass found this same hole but
      discarded it as a mic port or similar, reasoning it sat BELOW the
      knob -- that was backwards because the knob was itself misplaced at
      the time (see the knob's note); with the knob corrected, this hole is
      exactly where the brief says the LED should be. Y pushed to 49 (clear
      of the body's real surface radius here, ~47) so the hidden-line test
      doesn't wrongly hide it, same basis as grille/bezel/knob.

camera:
  front:
    view_dir: [0, -1, 0]
    up: [0, 0, 1]
    note: Looking in -Y at the +Y-facing grille, matches the reference photo.
  underside:
    view_dir: [0, 0, 1]
    up: [0, 1, 0]
    note: Looking up (+Z) from below at the collar/USB-C port.
