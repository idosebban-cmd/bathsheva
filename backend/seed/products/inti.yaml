# No bought-in parts, prices or assembly time have been specified: no default cost items yet (TBD).
cost_items: []

pricing:
  source: "Retail price TBD"

power_options:
  - key: A
    label: "A: USB-C power (battery or mains TBD)"
    scenario: null

scenarios: []

cost_down_notes:
  - "INTI's unit cost covers only the manufactured parts on placeholder CAD dimensions: the driver, battery, board, connectors, hardware, packaging, assembly and testing are TBD and not costed yet."

# Everything the concept doesn't fix yet. Shown in the DFM report; replace each with the user's answer.
tbd:
  - {topic: Dimensions, item: "Overall height, width and depth of the head", why: "Every CAD parameter is a placeholder until these are given."}
  - {topic: Dimensions, item: "Position and size of the brow-and-nose piece, eyes, grille, side dials, top rim, base ring and rear panel", why: "Placed by eye on a placeholder head."}
  - {topic: Form, item: "The sculpted head surface (surface model or 3D scan of the master)", why: "The model is an ellipsoid stand-in."}
  - {topic: Body, item: "Jesmonite grade and reinforcement, wall thickness, local thickening and cast-in inserts", why: "Sets the mass, strength and the cost."}
  - {topic: Body, item: "Colour standard (cream/ivory reference, e.g. hex or RAL), gloss level and the lacquer-like finish system", why: "Needed for the finish spec and samples."}
  - {topic: Body, item: "How the body is closed at the base and how the electronics go in", why: "No closure or access is defined."}
  - {topic: Metal, item: "Metal for each brass/gold part (solid brass alloy, or another real metal with a gold finish)", why: "The concept says brass/gold; the alloy decides process and cost."}
  - {topic: Metal, item: "Finish of the brass/gold parts (brushed or polished; clear lacquer, plating or PVD) and one matched tone", why: "Sets the finishing route and cost."}
  - {topic: Metal, item: "Process for each metal part (cast, machined, spun, pressed, etched)", why: "The rules engine recommends one until decided."}
  - {topic: Metal, item: "How each metal part is fixed to the Jesmonite", why: "Bonded, cast-in inserts or screws from inside: not decided."}
  - {topic: Grille, item: "Step form (concentric rings or other), perforation pattern, open area and sheet thickness", why: "Modelled as solid concentric steps."}
  - {topic: Controls, item: "Which side dial is the volume control, what the other dial does, and travel, detents and edge detail", why: "Only 'one is the volume control' is given."}
  - {topic: Rear panel, item: "Panel material, finish, size and fixing", why: "If it looks metallic it must be real metal (design constraint)."}
  - {topic: Electronics, item: "Driver(s): type, size, power rating; enclosure type (sealed or ported) and air volume", why: "Only 'front grille only' is given."}
  - {topic: Electronics, item: "Amplifier power, Bluetooth version, codecs, range and features (multipoint, app, microphone)", why: "Only 'Bluetooth speaker' is given."}
  - {topic: Power, item: "Power source: a rechargeable battery charged over USB-C, or mains power over USB-C (no battery)", why: "The concept gives USB-C for power and charging; whether there is a battery is not decided (user, Oct 2026)."}
  - {topic: Electronics, item: "If battery-powered, the battery: chemistry, cells, capacity, runtime target, charge power and time", why: "Nothing about a battery is given."}
  - {topic: Electronics, item: "Status indication (LED or none) and any buttons besides the dials", why: "Not shown in the design facts."}
  - {topic: Commercial, item: "Target retail price, production volume, target unit cost and markets", why: "Needed for the cost model, pricing targets and certification."}
  - {topic: Mass, item: "Target mass and stability", why: "No mass target is given."}
