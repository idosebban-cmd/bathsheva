# INTI product template: a home Bluetooth speaker for Bathsheva London. Seeds a new INTI project.
#
# Sources, in priority order:
#   1. The user's design facts (Oct 2026). Where the render disagrees, these win (the render's third rear
#      port, POWER, is not modelled; see `tbd`).
#   2. The concept render, docs/inti/concept.png (front, side, rear and detail views): the form and the
#      proportions. app/cad/inti.py holds the proportions measured on it (fractions of the overall height).
#   No dimension or electrical spec has been given: every such value is TBD (null) and listed under `tbd`
#   below (shown in the DFM report). The overall height and the material thicknesses in `cad_parameters` are
#   placeholders (TBD_PARAMS); the width, depth and every feature follow the render's proportions.

name: INTI
description: >-
  A home Bluetooth speaker for Bathsheva London: a sculpted, head-shaped body in cream/ivory cast
  Jesmonite with a smooth lacquer-like finish, with brass/gold metal features: a brow-and-nose piece,
  two eyes, a stepped front grille, two side dials (one the volume control), a top rim and a base ring.
  Front grille only; a rear connection panel with USB-C (power and charging) and 3.5 mm aux.

requirements:
  approx_dimensions: {height_mm: null, width_mm: null, depth_mm: null}   # TBD
  target_retail_price: {amount: null, currency: GBP}                      # TBD
  production_volume: null                                                 # TBD
  target_unit_cost: {amount: null, currency: GBP}                         # TBD
  intended_markets: []                                                    # TBD
  power_type: undecided                                                   # TBD: battery, or mains over USB-C (user, Oct 2026)
  battery_runtime_h: null                                                 # TBD (only if battery-powered)
  preferred_materials:
    - Cast Jesmonite body (grade, reinforcement and wall thickness TBD)
    - "Brass/gold real-metal parts: brow-and-nose piece, two eyes, stepped front grille, two side dials, top rim, base ring (alloy and process TBD)"
  preferred_finishes:
    - Cream/ivory, smooth lacquer-like finish on the Jesmonite (colour standard, gloss level and system TBD)
    - Brass/gold on every visible metal part (brushed, polished, lacquered or PVD TBD)
  functional_requirements:
    - Bluetooth speaker (Bluetooth version, codecs, range and features TBD)
    - Front grille only; no rear grille
    - "Rear connection panel: USB-C (power and charging) and 3.5 mm aux input; no separate power jack"
    - Two side dials; one is the volume control (which side, and the other dial's function, TBD)
    - All visible metallic parts are real metal; no plastic substitutes
  environmental_requirements: []

assumed_fields: []

# One CAD body per part (cad_key matches the generator's body names). The eyes and dials are modelled once
# and mirrored (quantity 2). `non_metallic_look` marks the cream body: it may be non-metal while its finish
# doesn't look metallic. Every brass/gold part is `cosmetic`, so the design constraint "visible metal parts
# must be solid metal" applies to it.
parts:
  - cad_key: body
    name: Body
    function: >-
      Sculpted head-shaped shell (a mask: flat face, rounded back, narrower crown); recessed almond eye
      sockets, the grille opening, the dials on its sides, the top rim and base ring, and the inset rear
      connection panel. Wall, closure and internal fixings TBD.
    material_category: composite
    material: Jesmonite (grade TBD)
    finish: "Cream/ivory, smooth lacquer-like finish (system and gloss TBD)"
    traits: [cosmetic, non_metallic_look, fine_detail, closed_top, side_hole]
  - cad_key: brow_nose
    name: Brow-and-nose piece
    function: >-
      Brass/gold tapered nose wedge from the brow line at the crown, where it meets the top rim, down to a
      tip projecting from the face. Whether it is one part with the top rim, and its fixing, TBD.
    material_category: brass
    material: Brass (alloy TBD)
    finish: "Brass/gold (finish TBD)"
    traits: [cosmetic, fine_detail]
  - cad_key: eye
    name: Eye
    quantity: 2
    function: >-
      Brass/gold almond-shaped eye plate in a recessed socket, with a round pupil boss (two, mirrored).
      Fixing TBD.
    material_category: brass
    material: Brass (alloy TBD)
    finish: "Brass/gold (finish TBD)"
    traits: [cosmetic, short]
  - cad_key: grille
    name: Front grille
    function: >-
      Brass/gold grille over the driver, the only grille: a two-tier stepped (Andean) outline with a raised
      frame round a perforated field (round holes in a hex pattern in the render). Hole size, pitch, open
      area, sheet thickness and fixing TBD.
    material_category: brass
    material: Brass (alloy TBD)
    finish: "Brass/gold (finish TBD)"
    traits: [cosmetic, perforated, fine_detail]
  - cad_key: dial
    name: Side dial
    quantity: 2
    function: >-
      Brass/gold disc on each side of the head with a stepped cross in relief on its face; one is the volume
      control. Which side, the other dial's function, travel and detents TBD.
    material_category: brass
    material: Brass (alloy TBD)
    finish: "Brass/gold (finish TBD)"
    traits: [cosmetic, axisymmetric, short, user_accessible]
  - cad_key: top_rim
    name: Top rim
    function: >-
      Brass/gold band round the crown, full height at the brow and open at the back. Section and fixing TBD.
    material_category: brass
    material: Brass (alloy TBD)
    finish: "Brass/gold (finish TBD)"
    traits: [cosmetic, ring]
  - cad_key: base_ring
    name: Base ring
    function: >-
      Brass/gold elliptical plinth under the head, narrower than it; the speaker stands on it. Wall or solid,
      fixing and any foot or pad TBD.
    material_category: brass
    material: Brass (alloy TBD)
    finish: "Brass/gold (finish TBD)"
    traits: [cosmetic, ring, needs_mass]
  - cad_key: rear_panel
    name: Rear connection panel
    function: >-
      Inset rounded-rectangle panel low on the back of the head (black in the render) carrying the USB-C port
      (power and charging) and the 3.5 mm aux input; no separate power jack. Material, finish and fixing TBD.
    material_category: other
    material: TBD
    finish: TBD
    traits: [cosmetic, side_hole]
  - cad_key: driver
    name: Driver
    function: Front-firing driver behind the front grille. Type, size and rating TBD (space-only placeholder).
    material_category: electrical
    finish: None (internal)
    traits: [electrical, internal]
  - cad_key: battery
    name: Battery pack
    function: >-
      Rechargeable battery charged over USB-C, only if INTI is battery-powered (power source TBD: battery, or
      mains over USB-C). Chemistry, cells, capacity and certification TBD (space-only placeholder).
    material_category: electrical
    finish: None (internal)
    traits: [electrical, internal]
  - cad_key: main_board
    name: Main board
    function: >-
      Bluetooth, amplifier, USB-C power and charging, 3.5 mm aux input and the dial inputs. Architecture TBD
      (space-only placeholder).
    material_category: electrical
    finish: None (internal)
    traits: [electrical, heat_source, internal]

# How parts join: not decided for any part (TBD). Kept empty rather than guessed.
joints: []

open_decisions: []

# Decisions fixed by the concept (user, Oct 2026), recorded on new projects. The power source is not one of
# them: battery or mains over USB-C is TBD (user, Oct 2026). The Jesmonite grade is TBD;
# AC100 with glass fibre is the only Jesmonite in the rules data, so the route records it and the reason
# says the grade is still open. The metal parts' processes are not decided: the rules engine recommends.
decisions:
  - part: body
    process: jesmonite_casting
    material: jesmonite_ac100
    reason: >-
      Cast Jesmonite body (concept, user Oct 2026). Grade, reinforcement, wall thickness and the lacquer-like
      finish system are TBD; AC100 is recorded as the only Jesmonite in the rules data.

# Electrical model: the power source is TBD and no battery or loads have been specified, so there is no runtime
# estimate yet.
electrical:
  runtime_basis: "on a basis still TBD (power source, battery and listening level not specified)"
  compliance:
    - "Radio, EMC and safety approval for a Bluetooth speaker in each market (markets TBD), e.g. UKCA under the UK Radio Equipment Regulations 2017 for the UK."
    - "If battery-powered: battery transport and safety testing (UN38.3, IEC 62133-2) once the battery is chosen."
    - "Bluetooth SIG qualification and listing."

# Default CAD parameters (mm). EVERY value is a placeholder (TBD). The overall height sets the size; the width
# (about 1.10 x), depth (about 0.60 x) and every feature follow the render's proportions (app/cad/inti.py).
cad_parameters:
  overall_height: 280
  wall_thickness: 5.0
  trim_thickness: 2.0
  driver_diameter: 76

# No bought-in parts, prices or assembly time have been specified: no default cost items yet (TBD).
cost_items: []

pricing:
  source: "Retail price TBD"

power_options:
  - key: A
    label: "A: USB-C power (battery or mains TBD)"
    scenario: null

scenarios: []

cost_down_notes:
  - "INTI's unit cost covers only the manufactured parts, at a placeholder size in the render's proportions: the driver, battery, board, connectors, hardware, packaging, assembly and testing are TBD and not costed yet."

# Everything the concept doesn't fix yet. Shown in the DFM report; replace each with the user's answer.
tbd:
  - {topic: Dimensions, item: "Overall height (the width, depth and every feature follow from it in the render's proportions)", why: "The render gives proportions, not size: the CAD's height is a placeholder."}
  - {topic: Form, item: "The sculpted head surface (surface model or 3D scan of the master), including the brow ridges above the eye sockets", why: "The model is lofted from sections measured on the render."}
  - {topic: Rear panel, item: "The render shows a third rear port marked POWER (a barrel jack); the design facts say no separate power jack. Which is right?", why: "The model follows the design facts: USB-C and aux only."}
  - {topic: Rear panel, item: "The rear marking: the stepped emblem and 'SOUND CONNECTS US' (printed, engraved or cast; size and finish)", why: "Shown in the render's rear view; not modelled."}
  - {topic: Metal, item: "Whether the brow-and-nose piece and the top rim are one part or two", why: "In the render the nose meets the rim, whose front reads as the brow."}
  - {topic: Body, item: "Jesmonite grade and reinforcement, wall thickness, local thickening and cast-in inserts", why: "Sets the mass, strength and the cost."}
  - {topic: Body, item: "Colour standard (cream/ivory reference, e.g. hex or RAL), gloss level and the lacquer-like finish system", why: "Needed for the finish spec and samples."}
  - {topic: Body, item: "How the body is closed at the base and how the electronics go in", why: "No closure or access is defined."}
  - {topic: Metal, item: "Metal for each brass/gold part (solid brass alloy, or another real metal with a gold finish)", why: "The concept says brass/gold; the alloy decides process and cost."}
  - {topic: Metal, item: "Finish of the brass/gold parts (brushed or polished; clear lacquer, plating or PVD) and one matched tone", why: "Sets the finishing route and cost."}
  - {topic: Metal, item: "Process for each metal part (cast, machined, spun, pressed, etched)", why: "The rules engine recommends one until decided."}
  - {topic: Metal, item: "How each metal part is fixed to the Jesmonite", why: "Bonded, cast-in inserts or screws from inside: not decided."}
  - {topic: Grille, item: "Perforation: hole size and pitch (round holes in a hex pattern in the render), open area and sheet thickness", why: "The stepped outline and frame are modelled; the holes are not."}
  - {topic: Controls, item: "Which side dial is the volume control, what the other dial does, and travel, detents and edge detail", why: "Only 'one is the volume control' is given."}
  - {topic: Rear panel, item: "Panel material, finish and fixing (black in the render)", why: "If it looks metallic it must be real metal (design constraint)."}
  - {topic: Electronics, item: "Driver(s): type, size, power rating; enclosure type (sealed or ported) and air volume", why: "Only 'front grille only' is given."}
  - {topic: Electronics, item: "Amplifier power, Bluetooth version, codecs, range and features (multipoint, app, microphone)", why: "Only 'Bluetooth speaker' is given."}
  - {topic: Power, item: "Power source: a rechargeable battery charged over USB-C, or mains power over USB-C (no battery)", why: "The concept gives USB-C for power and charging; whether there is a battery is not decided (user, Oct 2026)."}
  - {topic: Electronics, item: "If battery-powered, the battery: chemistry, cells, capacity, runtime target, charge power and time", why: "Nothing about a battery is given."}
  - {topic: Electronics, item: "Status indication (LED or none) and any buttons besides the dials", why: "Not shown in the design facts."}
  - {topic: Commercial, item: "Target retail price, production volume, target unit cost and markets", why: "Needed for the cost model, pricing targets and certification."}
  - {topic: Mass, item: "Target mass and stability", why: "No mass target is given."}
