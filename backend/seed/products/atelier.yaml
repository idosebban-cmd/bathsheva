    scenario: null

# Design-change scenarios for the Cost-down tab (same effects as Faro's; see faro.yaml).
scenarios:
  - key: nose_cone_spun
    letter: a
    label: Nose cone spun instead of CNC turned
    design_change: Spin the nose cone from 1050 aluminium disc instead of turning and hollowing 6061 bar; same outside shape.
    effect:
      reroute:
        part: nose_cone
        options:
          - {process: metal_spinning, material: al_1050, label: Spun 1050}
    premium_impact: none
    tradeoffs:
      finish: Spin lines are brushed out before PVD; the tip may need a small turned plug.
      weight: Lighter (thinner wall); the ballast makes it up.
      premium: Looks the same.
      lead_time: Spinning tools in 2–4 weeks.
      tooling: A spinning form (low cost).
  - key: custom_battery_pack
    letter: c
    label: Custom battery pack with its own certification testing
    design_change: >-
      Buy a custom 2 x 18650 1S2P pack (cheaper per unit, no test reports) instead of a pre-certified pack,
      and pay for UN38.3 and IEC 62133-2 testing once.
    effect:
      add_items:
        - {price_key: battery_pack_1s2p_custom, quantity: 1}
        - {price_key: battery_pack_testing, quantity: 1, kind: one_off}
      remove_items: [battery_pack_1s2p]
    premium_impact: none
    flags:
      - {kind: compliance, message: "Custom pack: UN38.3 and IEC 62133-2 must be passed before shipping or selling; allow 6–10 weeks for testing."}
    tradeoffs:
      finish: No change.
      weight: No change.
      premium: No change.
      lead_time: Adds 6–10 weeks of testing before launch.
      tooling: None; the testing is a one-off cost shared over the batch.
  - key: sealed_no_radiator
    letter: r
    label: Sealed box without the rear passive radiator
    design_change: >-
      Leave out the rear passive radiator, its cover, bezel and fabric: the prototype's sealed box. The back
      becomes plain red; the bass is thinner and the DSP has to work harder.
    effect:
      remove_part: [passive_radiator, rear_grille, rear_bezel, rear_fabric]
      remove_items: [passive_radiator_60x40]
      assembly_min: {low: -2, high: -1}
    premium_impact: slight
    flags:
      - {kind: performance, message: "Without the radiator the 60 Hz (−6 dB) bass target is unlikely to be met; check with the driver supplier."}
    tradeoffs:
      finish: A plain red back, as the approved prototype.
      weight: About 10 g lighter; the ballast makes it up.
      premium: Thinner bass at the spec's 60 Hz.
      lead_time: One part and one bezel fewer.
      tooling: One photo-tool and one CNC programme fewer.
  - key: low_tooling_first_batch
    letter: t
    label: Low-tooling first batch
    design_change: >-
      For a first batch of a few hundred: the body cast in polyurethane in silicone moulds (soft tooling)
      instead of injection-moulded PC/ABS, with the same primer, colour and clear lacquer; the fins, base
      collar and foot CNC-machined or investment-cast in brass instead of zinc die-cast, with the same gold
      PVD. Everything else unchanged. No steel mould and no die-casting dies.
    effect:
      reroutes:
        - {part: body, process: pu_vacuum_casting, material: pu_casting_resin, tooling: low}
      reroute:
        parts: [fin, collar, foot]
        options:
          - {process: cnc_machining, material: brass, tooling: none, label: CNC-machined brass}
          - {process: investment_casting, material: brass, label: Investment-cast brass}
      add_items:
        - {price_key: pu_silicone_mould_share, quantity: 1, kind: tooling}
    premium_impact: slight
    flags:
      - {kind: performance, message: "Cast polyurethane is less tough and less heat-resistant than PC/ABS: repeat the 0.5 m drop test, the lacquer adhesion (ISO 2409) and the 40 °C storage test on cast bodies."}
      - {kind: performance, message: "Brass instead of Zamak adds about 150 g to the fins, collar and foot; the ballast cup is made lighter to keep 1.8 kg (aluminium was ruled out: about 300 g lighter, and the ballast is already at its maximum)."}
    tradeoffs:
      finish: Same lacquer and the same gold PVD. Cast bodies need a primer coat; brass takes PVD over a nickel base as Zamak does over copper-nickel.
      weight: About 150 g more metal in the fins, collar and foot; the ballast is reduced to keep 1.8 kg. The cast body weighs about the same.
      premium: Looks the same; the cast body is less tough, and size and colour drift slightly between silicone moulds.
      lead_time: Soft tooling in 2–4 weeks instead of 8–14 weeks for the steel mould and dies; casting by hand is slower per part.
      tooling: A master pattern for the body, silicone moulds remade about every 20 bodies, and CNC programmes or wax-injection tools for the brass parts.
    conflicts: [jesmonite_body]
  - key: jesmonite_body
    letter: j
    label: Jesmonite body
    design_change: >-
      The body cast in Jesmonite AC100 with glass-fibre reinforcement in silicone moulds at a UK caster
      (soft tooling; moulds replaced every 20–30 casts), about 5 mm wall instead of 3 mm moulded PC/ABS,
      with cast-in brass inserts for the driver, radiator and fin fixings. Sealer and primer, then the same
      oxblood lacquer and clear coats. The heavier body takes weight off the ballast cup, so the speaker
      stays at 1.8 kg. The gold parts stay die-cast Zamak, or are CNC-machined in brass.
    conflicts: [low_tooling_first_batch]
    effect:
      reroutes:
        - {part: body, process: jesmonite_casting, material: jesmonite_ac100, tooling: low}
      # Body volume at a 5 mm wall / at the CAD's 3 mm wall, from the CAD (tests/test_atelier_costs.py checks it).
      volume_scale: {body: 1.571}
      reroute:
        parts: [fin, collar, foot]
        options:
          - {process: zinc_die_casting, material: zamak_5, label: Die-cast Zamak (as now)}
          - {process: cnc_machining, material: brass, tooling: none, label: CNC-machined brass}
      add_items:
        - {price_key: jesmonite_silicone_mould_share, quantity: 1, kind: tooling}
        - {price_key: jesmonite_cast_in_inserts, quantity: 1}
        - {price_key: jesmonite_sealer_primer, quantity: 1, kind: finishing}
    premium_impact: slight
    flags:
      - {kind: safety, message: "Verify on samples: drop test (0.5 m unpackaged, ISTA 2A packaged) and the IEC 62368-1 enclosure impact test; Jesmonite is brittle compared with PC/ABS and can crack or chip."}
      - {kind: performance, message: "Verify on samples: gloss lacquer adhesion over the sealer and primer (ISO 2409 cross-cut, ≥ 90 GU gloss) and after humidity cycling."}
      - {kind: performance, message: "Verify on samples: Bluetooth range (10 m) through the 5 mm mineral-filled wall; the antenna position may need to move."}
      - {kind: performance, message: "Air volume falls to about 0.68 L (0.69 L with brass gold parts), below the spec's 0.7–0.8 L: the 5 mm wall takes room from the box. Recheck the radiator tuning, or thin the wall where it carries no load."}
      - {kind: performance, message: "The ballast cup gets narrower (Ø42) and the battery pocket splits it into separate steel segments; redesign the ballast (e.g. a ring above the battery) before tooling."}
    tradeoffs:
      finish: The same oxblood lacquer and clear coats over a sealer and primer; the porous cast surface must be sealed first.
      weight: The body is about three times heavier; the ballast cup shrinks to keep 1.8 kg, and the centre of mass rises.
      premium: A heavier, stone-like shell that sounds deader when tapped; more brittle than moulded plastic.
      lead_time: Soft tooling in 3–6 weeks from a UK caster instead of 8–14 weeks for the steel mould.
      tooling: A master pattern and silicone moulds remade every 20–30 casts; the gold parts keep their dies or are CNC-machined.

# Notes shown under the Cost-down summary.
cost_down_notes:
  - "One power option: cordless (2 x 18650 1S2P, USB-C PD)."
  - "Tiers: 'no compromise' uses only changes that keep the look and feel (spun nose cone, custom battery pack); 'slight compromises' also allows the sealed box without the rear radiator, the low-tooling first batch (cast polyurethane body, brass instead of zinc) and the Jesmonite body."
  - "Jesmonite body (j): cast Jesmonite AC100 body (5 mm, glass-fibre reinforced, UK caster) with the gold parts die-cast or CNC brass; drop test, lacquer adhesion and Bluetooth range to verify on samples; its rates are model-generated and unverified."
  - "Low-tooling first batch (t): soft tooling for the body and no die-casting dies, for a first batch of a few hundred; its rates (polyurethane casting, silicone moulds, CNC or investment-cast brass) are model-generated and unverified."

# Questions for suppliers (shown in the Factory Pack; resolved once they have an `answer`).
rfq_open_questions:
  - id: body_tooling
    topic: Moulding
    question: "Body mould: collapsible core, or two halves welded (the seam disappears under the lacquer)?"
    why: The belly (Ø95) is wider than both openings (about Ø43 and Ø47), so a simple core can't come out.
    proposed: "Moulder to propose, with the effect on cost, lead time and where the internal seats go."
  - id: driver_data
    topic: Acoustics
    question: "Driver and radiator datasheets (Thiele-Small values, Xmax, net displaced volume, rated power)?"
    why: The air volume (about 0.74 L) and the bass tuning are estimates from typical values until we have them.
    proposed: Electronics supplier proposes a 57 mm neodymium driver rated 20 W and a mass-tunable 60 x 40 mm radiator.
  - id: boost_and_cells
    topic: Electronics
    question: "20 W from a 1S2P pack: boost converter topology, and the cells' continuous current rating?"
    why: About 8 A from the battery at full power (4 A per cell).
    proposed: "Boost to 12–15 V ahead of the Class-D amplifier; branded power cells rated 10 A or more."
  - id: bayonet
    topic: Mechanical
    question: "Nose-cone bayonet with a hidden detent and the O-ring: lugs on the aluminium spigot or moulded into the body?"
    why: Specified but not yet detailed; affects the moulding and the nose cone's machining.
    proposed: Three lugs on the turned spigot, L-slots moulded inside the body's top rim, detent bump in the slot.
  - id: pvd_match
    topic: Finish
    question: "Can one coater hold ΔE ≤ 1.5 across PVD on brass, Zamak, 6061 and stainless?"
    why: Every visible metal part is gold PVD in one matched tone (spec).
    proposed: One PVD house for all parts, matched to the signed master sample; base layers per substrate.
  - id: mass_margin
    topic: Mechanical
    question: "Part weights (driver, radiator, battery, board, PVD parts) as quoted?"
    why: The steel ballast cup is at its largest size to reach 1.8 kg; lighter parts would leave the speaker short.
    proposed: Weigh first samples; options are a denser or taller ballast, or a heavier collar.

# What the RFQs state.
rfq:
  product_line: rocket Bluetooth speaker
  first_order: "Our likely first order is 300 to 500 speakers, depending on pre-orders. Please quote all three tiers."
  launch_market: UK
  marking: "UKCA marking for the UK launch (radio equipment). CE marking for the EU may follow: tell us what it would add."
  incoterms: ["FOB (port of loading)", "DDP to our UK address: [DELIVERY ADDRESS, to be filled in]"]
  currencies: [GBP, USD]
  tolerances: "General tolerances ISO 2768-m on metal parts and ISO 20457 (moulded) on the body unless a drawing states otherwise; seams 0.3 ±0.1 mm, flush within 0.1 mm; knob gap 0.3 ±0.05 mm."
  aql: "AQL 1.0 for major and 2.5 for minor cosmetic defects; Bathsheva London approves the golden sample before production."
  colour_note: "Signed physical master samples are the colour authority. The hex values are the design reference; the RAL references are approximate and for guidance only."
  colours:
    - {name: Oxblood red polished lacquer, parts: [body], hex: "#8A1C15", ral: ["RAL 3011 Brown red", "RAL 3002 Carmine red"],
       gloss: "≥ 90 GU (60°), primer + colour + two clear coats, polished; ΔE ≤ 1.0 to the master",
       source: "Technical Specification; Atelier params.py RED_HEX"}
    - {name: "Gold PVD, fine brushed satin", parts: [nose_cone, fin, collar, foot, grille, bezel, rear_grille, rear_bezel, knob],
       hex: "#C4A15A", ral: [], gloss: "fine brushed satin; one tone, ΔE ≤ 1.5 across parts",
       source: "Technical Specification; prototype GOLD_HEX (render reference only)"}
