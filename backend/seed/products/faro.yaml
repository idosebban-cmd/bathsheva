# Faro product template. Seeds a new Faro project.
# Every value here is editable. Placeholder commercial inputs are listed in
# `assumed_fields` so the UI labels them as assumptions.
#
# Source of truth for the design: the approved prototype model on branch
# claude/rocket-speaker-3d-model-xav3pn (faro/lamp.py, faro/params.py and the
# build manual), adapted for production in metal (decisions Oct 2026).

name: Faro
description: >-
  A premium decorative cordless table lamp in the form of a lighthouse: black
  base with a brass nameplate, cream tower with a red lower section and five
  glowing windows spiralling up it, brass gallery and railing, frosted lantern
  and a red twist-lock cap with a brass finial. Rechargeable over USB-C.
  Second product of Bathsheva London, after the Atelier speaker.

requirements:
  approx_dimensions: {height_mm: 300, width_mm: 113, depth_mm: 113}     # prototype (confirmed Oct 2026); felt adds 1.9 mm
  target_retail_price: {amount: 275, currency: GBP}                     # user, Oct 2026; compared at 199 / 229 / 275
  production_volume: null                                               # TBD
  target_unit_cost: {amount: null, currency: GBP}                       # TBD
  intended_markets: [UK]                                                 # UK launch (Oct 2026); CE for the EU may follow
  power_type: battery
  battery_runtime_h: 8                                                  # at full brightness, lantern + tower lights on
  preferred_materials:
    - Spun aluminium base, tower and cap
    - Solid brass gallery, railing, lantern frame, finial, knob and nameplate
    - Borosilicate glass lantern and window diffuser (no plastic on visible parts)
  preferred_finishes:
    - Satin black lacquer base (30–50 GU), clear-coated
    - Cream and oxblood red gloss lacquer (80+ GU) on aluminium (two-tone tower, masked line)
    - Brushed (satin) brass, clear lacquer
  functional_requirements:
    - Cordless decorative table lamp, rechargeable over USB-C (2 x 18650 cells)
    - User-replaceable battery (bottom plate on standard screws)
    - Dimmable with a rotary brass knob on the tower
    - Light from a frosted lantern and five glowing tower windows
    - Twist-lock cap that lifts off to reach the lantern LED
    - Stable on a table or shelf
  environmental_requirements:
    - Indoor, domestic use

assumed_fields:
  - production_volume
  - target_unit_cost

# One CAD body per part (cad_key must match the generator's body names).
# Traits: `hidden` marks functional parts that are never seen (they may be plastic or
# rubber); `visible_trim` marks bought-in parts with a visible metal element.
# made_to_drawing: bought-in parts that still get a drawing in the factory pack.
parts:
  - cad_key: base
    name: Base
    function: >-
      Spun aluminium shell with a generous rounded top edge. Houses the battery, the
      control board (USB-C port at the rear) and the steel weight plate.
    material_category: aluminium
    finish: Satin black lacquer (30–50 GU), clear-coated
    traits: [axisymmetric, cosmetic, closed_top, thin_wall, needs_mass, side_hole]
  - cad_key: base_plate
    name: Bottom plate
    function: Laser-cut aluminium plate closing the base; four M2.5 screws into the standoffs so the battery can be replaced.
    material_category: bought_in
    material: Aluminium 5052, 2 mm
    process: Laser cut, countersunk (made to drawing)
    finish: Black lacquer
    traits: [hidden, user_accessible]
    made_to_drawing: true
  - cad_key: felt_pad
    name: Felt pad
    function: Felt laminated to a thin steel disc, held by four magnets in the bottom plate; covers the screws.
    material_category: bought_in
    finish: Black felt
    traits: [hidden]
  - cad_key: weight_plate
    name: Weight plate
    function: Laser-cut steel plate round the battery, screwed up into the cream band; gives the lamp its planted feel.
    material_category: bought_in
    material: Mild steel S275 (zinc plated)
    process: Laser cut and zinc plated (made to drawing)
    finish: Zinc plated
    traits: [hidden, needs_mass]
    made_to_drawing: true
  - cad_key: nameplate
    name: Nameplate
    function: Curved brass plate with "FARO" etched in, bonded on the front of the base.
    material_category: brass
    finish: Brushed (satin), etched lettering filled black, clear lacquer
    traits: [cosmetic, fine_detail, flat_pattern, thin_wall]
  - cad_key: band_cream
    name: Cream band
    function: Turned aluminium ring between base and tower; the base screws into it and the tower is bonded on its spigot.
    material_category: aluminium
    finish: Cream lacquer, gloss (80+ GU), clear-coated
    traits: [axisymmetric, cosmetic, ring, short, open_both_ends, mounting_holes]
  - cad_key: tower
    name: Tower
    function: >-
      Spun tapered cone, lacquered cream with a red lower section (masked line),
      with five arched windows spiralling up it and the dimmer knob on the front.
    material_category: aluminium
    finish: Two-tone lacquer (cream, oxblood red lower section, masked line), gloss (80+ GU), clear-coated
    traits: [axisymmetric, cosmetic, thin_wall, open_both_ends]
  - cad_key: diffuser
    name: Window diffuser
    function: >-
      Opal borosilicate tube inside the tower, only as long as the window zone, behind all five
      windows so they glow evenly and hide the internals; carried on a spider on the tower-light spine.
    material_category: clear_polymer_or_glass
    finish: Opal (acid-etched) glass
    traits: [axisymmetric, transparent, thin_wall, open_both_ends, near_heat_source]
  - cad_key: tower_light
    name: Tower light
    function: LED filament strips on a central aluminium spine inside the diffuser; lights the windows and carries the wiring.
    material_category: electrical
    finish: None (internal)
    traits: [electrical, heat_source, internal]
  - cad_key: dimmer
    name: Dimmer
    function: Slim rotary potentiometer with switch behind the tower wall; its shaft carries the brass knob.
    material_category: electrical
    finish: None (internal)
    traits: [electrical, internal]
  - cad_key: knob
    name: Dimmer knob
    function: Solid turned brass knob on the front of the red section (on/off and dimming).
    material_category: brass
    finish: Brushed (satin), clear lacquer
    traits: [axisymmetric, cosmetic, short, user_accessible]
  - cad_key: gallery
    name: Gallery
    function: >-
      Spun brass platform ring (1 mm sheet) on the tower top: flat top with a ledge for the lantern
      LED and a rounded rim, open underneath, with a soldered brass locating ring bonded into the tower.
    material_category: brass
    finish: Brushed (satin), clear lacquer
    traits: [axisymmetric, cosmetic, ring, short, open_both_ends, thin_wall]
  - cad_key: railing
    name: Gallery railing
    function: Photo-etched brass strip (posts and two rails) rolled into a ring, soldered at the seam and onto the gallery.
    material_category: brass
    finish: Brushed (satin), clear lacquer
    traits: [axisymmetric, cosmetic, fine_detail, thin_wall, ring, open_both_ends]
  - cad_key: lantern_frame
    name: Lantern frame
    function: >-
      Turned brass bottom ring and top band (bayonet lip and slots) with eight mullion bars
      soldered between them; lowered over the glass and bonded to the gallery.
    material_category: brass
    finish: Brushed (satin), clear lacquer
    traits: [axisymmetric, cosmetic, ring, open_both_ends, user_accessible]
  - cad_key: lantern_glass
    name: Lantern glass
    function: Frosted borosilicate tube standing on the gallery inside the frame.
    material_category: clear_polymer_or_glass
    finish: Frosted (acid-etched inside)
    traits: [axisymmetric, transparent, thin_wall, open_both_ends, near_heat_source]
  - cad_key: led_module
    name: Lantern LED
    function: Warm white LED board on an aluminium spreader resting on the gallery ledge; lifts out with the cap off.
    material_category: electrical
    finish: None (internal)
    traits: [electrical, heat_source, internal]
  - cad_key: cap
    name: Cap
    function: Spun domed cap with a rim and a small neck for the finial; twist-locks onto the lantern frame.
    material_category: aluminium
    finish: Oxblood red lacquer, gloss (80+ GU), clear-coated
    traits: [axisymmetric, cosmetic, closed_top, domed, thin_wall, user_accessible]
  - cad_key: cap_spigot
    name: Cap bayonet spigot
    function: Turned brass ring with four lugs, bonded inside the cap; the lugs lock under the lantern's lip with a 20° turn.
    material_category: brass
    finish: None (hidden when fitted)
    traits: [axisymmetric, hidden, ring, short]
  - cad_key: finial
    name: Finial
    function: Turned brass ball on a neck, with an M4 stud through the cap (nut inside).
    material_category: brass
    finish: Brushed (satin), clear lacquer
    traits: [axisymmetric, cosmetic, short, user_accessible]
  - cad_key: battery
    name: Battery pack
    function: 2 x 18650 Li-ion cells with a protection circuit, lying flat in the base; user-replaceable.
    material_category: electrical
    finish: None (internal)
    traits: [electrical, internal, user_accessible]
  - cad_key: charge_board
    name: Control board
    function: USB-C charging, the 2-cell charger and the 2-channel LED driver with the dimmer input; USB-C port at the rear.
    material_category: electrical
    finish: None (internal)
    traits: [electrical, internal, user_accessible]

# How parts join. References fasteners.yaml keys. `hardware` lines appear in the BOM.
joints:
  - between: [base, band_cream]
    method: machine_screw_tapped
    note: Three M3 screws from inside the base, through the weight plate and the base top, into tapped holes in the band.
    hardware:
      - {name: "M3 x 25 socket screw, weight plate + base to band", quantity: 3, material: "Stainless steel (A2)",
         notes: "Heads in counterbores in the weight plate; length to suit the plate thickness."}
  - between: [weight_plate, base]
    method: machine_screw_tapped
    note: Clamped against the base top by the same three band screws.
  - between: [band_cream, tower]
    method: adhesive_bonding
    note: The tower foot sits over the band's spigot and is bonded (structural adhesive).
  - between: [tower, gallery]
    method: adhesive_bonding
    note: The gallery's spigot sits inside the tower top and is bonded.
  - between: [gallery, railing]
    method: adhesive_bonding
    note: Railing soldered (or bonded) to the gallery top.
  - between: [gallery, lantern_frame]
    method: adhesive_bonding
    note: The frame is lowered over the glass and bonded to the gallery.
  - between: [lantern_frame, cap]
    method: bayonet
    note: Four lugs on the cap spigot drop through slots in the frame's lip and turn 20° clockwise to a stop.
  - between: [cap, cap_spigot]
    method: adhesive_bonding
    note: Spigot flange bonded under the cap shoulder.
  - between: [base_plate, weight_plate]
    method: machine_screw_tapped
    note: Four M2.5 countersunk screws into hex standoffs screwed into the weight plate (user can replace the battery).
    hardware:
      - {name: "M2.5 x 6 countersunk screw, hex socket", quantity: 4, material: "Stainless steel, black", notes: "Bottom plate to standoffs."}
      - {name: "M2.5 hex standoff, aluminium", quantity: 4, material: "Aluminium", notes: "Length to suit the plate thickness."}
      - {name: "N52 magnet 6 x 2 mm", quantity: 4, material: "NdFeB, nickel plated", notes: "Bonded into the bottom plate; hold the felt disc."}
  - between: [diffuser, tower]
    method: clamp_with_gasket
    note: Diffuser sits on a spider on the tower-light spine (silicone ring); a second ring centres its top inside the tower.
    hardware:
      - {name: "Silicone ring, diffuser", quantity: 2, material: "Silicone", notes: "Sized for the diffuser tube; section TBD."}

# Project-level decisions that are still open.
open_decisions: []

# Engineering decisions accepted by the user (Oct 2026), recorded on new projects.
decisions:
  - part: base
    process: metal_spinning
    material: al_1050
    reason: >-
      Spun aluminium base shell with a laser-cut steel weight plate round the battery:
      the prototype's form with real metal and real weight. Tip-over stability stays an
      open safety check.
  - part: band_cream
    process: cnc_turning_near_net
    material: al_6061
    reason: >-
      Turned from aluminium tube or a ring blank (not solid bar); it carries the tapped holes for the
      base screws and the spigot that locates the tower.
  - part: tower
    process: metal_spinning
    material: al_1050
    reason: >-
      One spun cone with two-tone lacquer (red lower section, masked line) replaces the
      prototype's separate red band; windows laser-cut after spinning.
  - part: diffuser
    process: glass_tube_cut
    material: borosilicate
    reason: One opal borosilicate tube behind all five windows replaces five resin diffusers (glass, not plastic, on view).
  - part: gallery
    process: metal_spinning
    material: brass
    reason: >-
      Spun brass ring (about 0.1 kg instead of 0.4 kg of solid brass) with the photo-etched railing on
      top: the same brass gallery from every normal viewing angle; open underneath.
  - part: railing
    process: photo_etching
    material: brass
    reason: Photo-etched brass rolled into a ring (default); soldered wire and lost-wax casting stay as alternatives.
  - part: lantern_frame
    process: cnc_turning_near_net
    material: brass
    reason: >-
      Rings turned from brass tube with drawn brass mullion bars soldered between them; the bayonet
      lip and slots are machined in the top band. Not machined from solid bar.
  - part: lantern_glass
    process: glass_tube_cut
    material: borosilicate
    reason: Frosted borosilicate tube, 2 mm wall (the prototype's 1.2 mm ring is thinner than stock tube).
  - part: cap
    process: metal_spinning
    material: al_1050
    reason: Spun cap with the neck spun in; a turned brass spigot carries the bayonet lugs.
  - part: cap_spigot
    process: cnc_turning_near_net
    material: brass
    reason: Lugs can't be spun, so they are turned on a brass ring (from tube) bonded inside the cap.
  - part: finial
    process: cnc_turning_near_net
    material: brass
    reason: "Turned from close-fitting brass bar: ball and neck with an M4 stud."
  - part: knob
    process: cnc_turning_near_net
    material: brass
    reason: Solid brass knob turned from close-fitting bar, on a D-shaft rotary pot.
  - part: nameplate
    process: photo_etching
    material: brass
    reason: Etched brass plate bonded on the surface (a recess can't be spun into the base).
  - topic: power
    chosen: {value: battery}
    reason: Cordless and rechargeable over USB-C with 2 x 18650 cells (baseline); the external 12 V adapter stays as option B.
  - topic: construction
    chosen: {value: bonded_and_screwed}
    reason: >-
      No central rod: the base screws into the turned band through the weight plate, the
      tower and gallery are bonded on turned spigots, and the cap twist-locks on.

# Electrical model for the runtime estimate (pure calculation in app/electrical.py).
electrical:
  battery:
    cells: 2
    cell_capacity_mah: 3350
    cell_voltage: 3.6
    usable_fraction: 0.90
    source: "model-generated (typical branded 18650, e.g. 3,350 mAh class; check the chosen cell's datasheet)"
    confidence: low
    verified: false
  driver_efficiency: 0.85
  loads:
    - {part: led_module, name: Lantern LED, watts: 1.5, source: model-generated, confidence: low, verified: false}
    - {part: tower_light, name: Tower light, watts: 0.8, source: model-generated, confidence: low, verified: false}
  compliance:
    - "Li-ion cells must have a protection circuit (over-charge, over-discharge, over-current and short circuit) with thermal protection for charging."
    - "UN38.3 test summary needed for the cells and pack before shipping (air and sea transport rules for lithium batteries). Baseline: a pre-certified pack whose supplier provides the UN38.3 summary; check it covers the exact pack (cells, configuration, protection board) and is current. A custom pack needs its own testing (scenario c)."
    - "IEC 62133-2 certification for the cells and pack (expected for UK sale, and for the EU if CE follows): supplied with the pre-certified pack; a custom pack needs its own report."
    - "EU Batteries Regulation (EU) 2023/1542 (applies if EU sale follows the UK launch): from 18 Feb 2027 portable batteries in appliances must be readily removable and replaceable by the end user with commonly available tools; plus labelling (CE, separate collection symbol, capacity) and producer registration. The screwed bottom plate (M2.5, standard hex key) is designed for this."
    - "UK: Waste Batteries and Accumulators Regulations 2009 (producer registration and take-back; UK rules are being revised). Verify with a compliance consultant."
    - "USB-C charging: confirm charging safety and EMC with the control-board supplier (e.g. IEC 62368-1 / EN 55015 as applicable)."

