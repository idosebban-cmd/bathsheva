  - {kind: bought_in, price_key: led_driver_mains, quantity: 1, power: mains}
  - {kind: bought_in, price_key: mains_cable_plug_switch, quantity: 1, power: mains}
  - {kind: bought_in, price_key: battery_pack, quantity: 1, power: battery}
  - {kind: bought_in, price_key: charge_control_board, quantity: 1, power: battery}
  - {kind: bought_in, price_key: usb_c_cable, quantity: 1, power: battery}
  - {kind: bought_in, price_key: dimmer_in_base, quantity: 1}
  - {kind: bought_in, price_key: screw_m4, quantity_param: mounting_hole_count}
  - {kind: bought_in, price_key: lamp_tube_m10, quantity: 1}
  - {kind: bought_in, price_key: lamp_nut_set, quantity: 1}
  - {kind: bought_in, price_key: cap_finial_nut, quantity: 1}
