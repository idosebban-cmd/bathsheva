# Faro product template. Seeds a new Faro project.
# Every value here is editable. Placeholder commercial inputs are listed in
# `assumed_fields` so the UI labels them as assumptions.

name: Faro
description: >-
  A premium decorative electrical table lamp inspired by a lighthouse. Smooth,
  sculptural and playful, influenced by mid-century Italian product design.
  Second product of Bathsheva London, after the Atelier speaker.

requirements:
  approx_dimensions: {height_mm: null, width_mm: null, depth_mm: null}  # TBD
  target_retail_price: {amount: 275, currency: GBP}                     # user, Oct 2026 (range 249–295)
  production_volume: null                                               # TBD
  target_unit_cost: {amount: null, currency: GBP}                       # TBD
  intended_markets: [UK, EU]
  power_type: undecided
  preferred_materials:
    - Aluminium main body
    - Painted / lacquered coloured aluminium sections
    - Possible brass or brass-plated details
    - Transparent lantern section
  preferred_finishes:
    - Coloured lacquer on aluminium
    - Black lacquer base
  functional_requirements:
    - Decorative table lamp with internal LED light source
    - Light emitted through a transparent lantern section
    - Stable on a table or shelf
  environmental_requirements:
    - Indoor, domestic use

assumed_fields:
  - approx_dimensions
  - production_volume
  - target_unit_cost
  - intended_markets

# One CAD body per part (cad_key must match the generator's body names).
parts:
  - cad_key: base
    name: Base
    function: Weighted foot that keeps the lamp stable; hides the cable exit and mounting screws.
    material_category: aluminium
    finish: Black lacquer
    traits: [axisymmetric, cosmetic, closed_top, needs_mass, mounting_holes, side_hole]
    open_questions:
      - Does the base need added mass (e.g. steel weight plate) to meet the stability target?
  - cad_key: main_body
    name: Main body
    function: Tapered lighthouse tower; the main visual surface of the lamp and the cable route to the lantern.
    material_category: aluminium
    finish: Coloured lacquer
    traits: [axisymmetric, cosmetic, thin_wall, open_both_ends]
  - cad_key: band
    name: Decorative band
    function: Contrasting ring around the tower, like a lighthouse gallery stripe.
    material_category: aluminium
    finish: Coloured lacquer (contrast) or brass-plated
    traits: [axisymmetric, cosmetic, ring, short]
    open_questions:
      - Is the band a separate coloured part, or could it be a painted stripe on the main body?
  - cad_key: lantern
    name: Lantern
    function: Transparent section that lets the LED light out.
    material_category: clear_polymer_or_glass
    finish: Clear, optionally frosted inside
    traits: [axisymmetric, transparent, thin_wall, open_both_ends, near_heat_source]
    open_questions:
      - Clear or frosted/diffused lantern?
  - cad_key: top_cap
    name: Top cap
    function: Domed roof of the lighthouse; closes the lantern.
    material_category: aluminium
    finish: Coloured lacquer or brass-plated
    traits: [axisymmetric, cosmetic, closed_top, domed]
  - cad_key: led_module
    name: LED module and mounting
    function: Light source and its mounting/heat-spreading bracket inside the lantern.
    material_category: electrical
    finish: None (internal)
    traits: [electrical, heat_source, internal]
    open_questions:
      - Target brightness (lumens) and colour temperature?
      - Dimmable?
  - cad_key: cable
    name: Cable / power entry
    function: Brings power into the lamp through the base, with strain relief.
    material_category: electrical
    finish: Cable colour to match
    traits: [electrical, user_accessible, strain_relief]
    open_questions:
      - Inline switch, touch dimmer or switch on the lamp?

# How parts join. References fasteners.yaml keys.
joints:
  - between: [base, main_body]
    method: machine_screw_tapped
    note: Screws from underneath the base into bosses or a ring in the body foot.
  - between: [main_body, band]
    method: adhesive_bonding
    note: Band slides over the taper and is bonded, or is clamped by the lantern seat.
  - between: [main_body, lantern]
    method: clamp_with_gasket
    note: Lantern sits in a seat with a soft gasket; clamped by the top cap via a central rod.
  - between: [lantern, top_cap]
    method: clamp_with_gasket
    note: Top cap retained by a central threaded rod from the LED mount.
  - between: [led_module, main_body]
    method: machine_screw_tapped
    note: LED bracket screwed to a plate at the top of the body.
  - between: [cable, base]
    method: strain_relief_grommet
    note: Cable passes through the base side hole with a strain-relief grommet.

# Project-level decisions that are still open.
open_decisions:
  - topic: power_type
    question: Mains or rechargeable battery?
    options: [mains, battery]
    impact: >-
      Changes the internal electronics, the cable/power entry part, the
      compliance scope and whether the metal body needs earthing.

# Default CAD parameters (mm). Placeholder dimensions: overall size is TBD.
cad_parameters:
  overall_height: 420
  base_diameter: 180
  base_height: 30
  body_diameter: 130
  body_top_diameter: 100
  wall_thickness: 2.0
  band_height: 22
  band_position: 0.55
  lantern_height: 80
  lantern_diameter: 90
  lantern_wall_thickness: 3.0
  top_cap_diameter: 110
  top_cap_height: 45
  cable_hole_diameter: 8
  mounting_hole_count: 3
  mounting_hole_diameter: 4.5
  mounting_hole_pcd: 110

# Default cost line items (prices come from seed/cost/bought_in.yaml).
# power: only include for that power type; undecided projects get the mains set.
# quantity_param: take the quantity from a CAD parameter.
cost_items:
  - {kind: bought_in, price_key: led_module, quantity: 1}
  - {kind: bought_in, price_key: led_driver_mains, quantity: 1, power: mains}
  - {kind: bought_in, price_key: mains_cable_plug_switch, quantity: 1, power: mains}
  - {kind: bought_in, price_key: battery_pack, quantity: 1, power: battery}
  - {kind: bought_in, price_key: charge_control_board, quantity: 1, power: battery}
  - {kind: bought_in, price_key: usb_c_cable, quantity: 1, power: battery}
  - {kind: bought_in, price_key: screw_m4, quantity_param: mounting_hole_count}
  - {kind: bought_in, price_key: screw_m3, quantity: 2}
  - {kind: bought_in, price_key: silicone_gasket, quantity: 2}
  - {kind: bought_in, price_key: cable_grommet, quantity: 1}
  - {kind: packaging, price_key: retail_packaging, quantity: 1}
  - {kind: assembly, name: "Final assembly, wiring and test", quantity: 20, unit: min, confidence: low}

# Retail pricing (user-stated). Channel economics come from seed/cost/pricing.yaml.
pricing:
  retail_price: 275
  retail_low: 249
  retail_high: 295
  premium_retail: 395
  source: "user (Oct 2026)"

# Design-change scenarios for the Cost-down tab. Each is toggleable; `options`
# are alternatives the optimiser can choose between. Effects:
#   reroute:      {part, options: [{process, material, tooling?, label}]}  (tooling: override band, e.g. none for stock tube)
#   remove_part:  cad_key of a part removed from the product
#   add_items / remove_items: bought-in lines by price_key (quantity or quantity_param)
#   assembly_min: change to assembly minutes {low, high}
#   scale_height: new overall height (mm); other linear dimensions scale with it
# premium_impact: none | slight | significant (significant = changes the design's look)
scenarios:
  - key: base_sheet
    letter: a
    label: Base spun or pressed from sheet, with a steel weight plate
    design_change: >-
      Base becomes a thin formed shell (spun, or pressed at volume) with a steel weight
      plate inside for mass, and rivet nuts instead of tapped holes.
    effect:
      reroute:
        part: base
        options:
          - {process: metal_spinning, material: al_1050, label: Spun}
          - {process: deep_drawing, material: al_1050, label: Pressed (deep drawn)}
      # The weight plate and rivet nuts come from seed/cost/route_changes.yaml
      # (thin_shell_needs_mass), so they are costed wherever a sheet base is used.
    premium_impact: none
    flags:
      - {kind: safety, message: "Stability is safety-relevant: tip-over must be verified on the finished lamp with the weight plate fitted."}
    tradeoffs:
      finish: Spun or pressed surface takes black lacquer well after light sanding; edges must be rolled or deburred.
      weight: The steel plate keeps the lamp heavy and planted, so it still feels substantial in the hand.
      premium: Looks the same from outside; the weight plate is hidden underneath.
      lead_time: Spinning forms in 2–4 weeks; press tools 6–10 weeks.
      tooling: Spinning form a few hundred pounds; press tool tens of thousands (only worth it at volume).
  - key: band_tube
    letter: b
    label: Band cut from stock tube or rolled strip
    design_change: >-
      Band becomes a straight ring cut from standard tube (or rolled and joined strip)
      sitting on a small step in the body, instead of a machined ring that follows the taper.
    conflicts: [band_stripe]
    effect:
      reroute:
        part: band
        options:
          - {process: extrusion, material: al_6063, tooling: none, label: Cut from stock tube}
          - {process: sheet_forming, material: al_5052, label: Rolled strip}
    premium_impact: none
    tradeoffs:
      finish: Stock tube has a good surface; a rolled strip has a joint that needs to sit at the back.
      weight: Slightly lighter than a machined ring.
      premium: Still a separate contrasting part with a crisp shadow line.
      lead_time: Stock tube is available in days.
      tooling: None for stock tube; simple rolls for strip.
  - key: lamp_tube
    letter: c
    label: Central threaded lamp tube construction
    design_change: >-
      One M10x1 threaded lamp tube runs from base to top cap; a single nut clamps the
      whole stack and the cable runs through the tube. Replaces tapped holes in thin walls.
    effect:
      add_items:
        - {price_key: lamp_tube_m10, quantity: 1}
        - {price_key: lamp_nut_set, quantity: 1}
      remove_items: [screw_m4, screw_m3, rivet_nut_m4]
      assembly_min: {low: -6, high: -2}
    premium_impact: none
    tradeoffs:
      finish: No visible fixings; parts can be finished completely before assembly.
      weight: Negligible change.
      premium: Cleaner, more serviceable construction typical of quality lamps.
      lead_time: Standard lamp hardware, available off the shelf.
      tooling: None.
  - key: band_stripe
    letter: d
    label: Band as a masked lacquer stripe on the body
    design_change: Remove the band part; paint the stripe directly on the body with a masked second colour.
    conflicts: [band_tube]
    effect:
      remove_part: band
      add_items:
        - {price_key: masked_stripe, quantity: 1, kind: finishing}
    premium_impact: slight
    tradeoffs:
      finish: A crisp masked line is achievable but needs a skilled finisher; no shadow line.
      weight: Slightly lighter.
      premium: Loses the layered look of a separate ring; the stripe reads flatter.
      lead_time: Removes one part from the supply chain.
      tooling: Masking jig only.
  - key: body_tube
    letter: e
    label: Body from stock aluminium tube with spun ends
    design_change: >-
      Body becomes a straight stock tube with small spun end rings. This removes the
      lighthouse taper, which is a significant change to the design.
    effect:
      reroute:
        part: main_body
        options:
          - {process: extrusion, material: al_6063, tooling: none, label: Stock tube}
      add_items:
        - {price_key: spun_end_ring, quantity: 2}
    premium_impact: significant
    tradeoffs:
      finish: Tube surface is excellent; die lines may need light brushing.
      weight: Similar.
      premium: Loses the tapered lighthouse silhouette that defines Faro.
      lead_time: Stock tube in days; end-ring forms 2–4 weeks.
      tooling: Small spinning forms for the end rings only.
  - key: lantern_stock
    letter: f
    label: Lantern from stock acrylic or borosilicate tube
    design_change: Lantern cut to length from standard tube; diameter must match a stock size.
    effect:
      reroute:
        part: lantern
        options:
          - {process: polymer_tube_cut, material: pmma, label: Stock acrylic tube}
          - {process: glass_tube_cut, material: borosilicate, label: Stock borosilicate tube}
    premium_impact: none
    tradeoffs:
      finish: Edges need polishing (acrylic) or fire-polishing (glass).
      weight: Glass is about twice as heavy as acrylic.
      premium: Borosilicate feels noticeably more premium; acrylic can scratch.
      lead_time: Stock tube in days.
      tooling: None.
  - key: external_adapter
    letter: g
    label: Off-the-shelf LED module with an external certified 12 V adapter
    design_change: >-
      Replace the internal mains driver and mains cable with a certified external 12 V
      adapter, a low-voltage cable and an off-the-shelf 12 V LED module.
    effect:
      add_items:
        - {price_key: led_module_12v, quantity: 1}
        - {price_key: external_adapter_12v, quantity: 1}
        - {price_key: lv_cable_switch, quantity: 1}
      remove_items: [led_module, led_driver_mains, mains_cable_plug_switch]
      assembly_min: {low: -5, high: -2}
    premium_impact: slight
    flags:
      - {kind: compliance, message: "Adapter choice must be verified for compliance (electrical safety, EMC, ecodesign) in each market."}
    tradeoffs:
      finish: No change to the lamp.
      weight: Lighter lamp; the adapter brick sits at the wall.
      premium: A plug-in adapter feels less premium than a mains cable, but it is common in design lighting.
      lead_time: Off-the-shelf parts; certification effort moves largely to the adapter supplier.
      tooling: None.
  - key: height_350
    letter: h
    label: Overall height reduced to 350 mm
    design_change: All linear dimensions scale with height (wall thicknesses and hole sizes stay the same).
    effect:
      scale_height: 350
    premium_impact: slight
    tradeoffs:
      finish: No change.
      weight: Lighter in proportion to size.
      premium: Less presence on a table; proportions are unchanged.
      lead_time: No change.
      tooling: Smaller forms, marginally cheaper.

# Premium brass edition: band and top cap in brass.
premium_edition:
  label: Premium brass edition
  parts: [band, top_cap]
  options:
    - key: plated
      label: Brass-plated band and top cap
      finish: brass_plating
    - key: solid
      label: Solid brass band and top cap (polished, clear lacquer)
      material: brass
      finish: polish
