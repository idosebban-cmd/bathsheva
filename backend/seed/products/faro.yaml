# Retail pricing (user-stated). Channel economics come from seed/cost/pricing.yaml.
pricing:
  retail_price: 275
  retail_low: 249
  retail_high: 295
  premium_retail: 395
  source: "user (Oct 2026)"

# Design-change scenarios for the Cost-down tab. Each is toggleable; `options`
# are alternatives the optimiser can choose between. Effects:
#   reroute:      {part, options: [{process, material, tooling?, label}]}  (tooling: override band, e.g. none for stock tube)
#   remove_part:  cad_key of a part removed from the product
#   add_items / remove_items: bought-in lines by price_key (quantity or quantity_param)
#   assembly_min: change to assembly minutes {low, high}
#   scale_height: new overall height (mm); other linear dimensions scale with it
# premium_impact: none | slight | significant (significant = changes the design's look)
# Power options shown side by side in the product view. Option B forces scenario g.
power_options:
  - key: A
    label: "A: internal mains dimmable driver"
    scenario: null
  - key: B
    label: "B: certified external low-voltage adapter + internal DC-DC driver"
    scenario: external_adapter

scenarios:
  - key: base_pressed
    letter: a
    label: Base pressed (deep drawn) instead of spun
    design_change: Same thin shell, weight plate and rivet nuts; the shell is deep drawn in a press tool instead of spun.
    effect:
      reroute:
        part: base
        options:
          - {process: deep_drawing, material: al_1050, label: Pressed (deep drawn)}
    premium_impact: none
    flags:
      - {kind: safety, message: "Stability is safety-relevant: tip-over must be verified on the finished lamp with the weight plate fitted."}
    tradeoffs:
      finish: Pressed surface is very consistent and takes black lacquer well.
      weight: Same as the spun shell; the steel plate provides the mass.
      premium: Looks the same as the spun base.
      lead_time: Press tools 6–10 weeks.
      tooling: Press tool tens of thousands of pounds; only worth it at volume.
  - key: band_stripe
    letter: d
    label: Band as a masked lacquer stripe on the body
    design_change: Remove the band part; paint the stripe directly on the body with a masked second colour.
    effect:
      remove_part: band
      add_items:
        - {price_key: masked_stripe, quantity: 1, kind: finishing}
    premium_impact: slight
    tradeoffs:
      finish: A crisp masked line is achievable but needs a skilled finisher; no shadow line.
      weight: Slightly lighter.
      premium: Loses the layered look of a separate ring; the stripe reads flatter.
      lead_time: Removes one part from the supply chain.
      tooling: Masking jig only.
  - key: body_tube
    letter: e
    label: Body from stock aluminium tube with spun ends
    design_change: >-
      Body becomes a straight stock tube with small spun end rings. This removes the
      lighthouse taper, which is a significant change to the design.
    effect:
      reroute:
        part: main_body
        options:
          - {process: metal_tube_cut, material: al_6063, tooling: none, label: Stock tube}
      add_items:
        - {price_key: spun_end_ring, quantity: 2}
    premium_impact: significant
    tradeoffs:
      finish: Tube surface is excellent; die lines may need light brushing.
      weight: Similar.
      premium: Loses the tapered lighthouse silhouette that defines Faro.
      lead_time: Stock tube in days; end-ring forms 2–4 weeks.
      tooling: Small spinning forms for the end rings only.
  - key: external_adapter
    letter: g
    label: "Power option B: certified external 12 V adapter with an internal DC-DC driver"
    design_change: >-
      Replace the internal mains driver and mains cable with a certified external 12 V
      adapter, a low-voltage cable and an internal step-up DC-DC constant-current driver
      for the same LED module. Dimming stays on the driver's dim input.
    effect:
      add_items:
        - {price_key: external_adapter_12v, quantity: 1}
        - {price_key: dc_dc_cc_driver, quantity: 1}
        - {price_key: lv_cable_switch, quantity: 1}
      remove_items: [led_driver_mains, mains_cable_plug_switch]
      replace_items: {dimmer_inline_mains: dimmer_inline_lv}
      assembly_min: {low: -4, high: -1}
    premium_impact: slight
    flags:
      - {kind: compliance, message: "Adapter and DC-DC driver must be verified for compliance (electrical safety, EMC, ecodesign) in each market."}
    tradeoffs:
      finish: No change to the lamp.
      weight: Lighter lamp; the adapter brick sits at the wall.
      premium: A plug-in adapter feels less premium than a mains cable, but it is common in design lighting.
      lead_time: Off-the-shelf parts; certification effort moves largely to the adapter supplier.
      tooling: None.
  - key: height_350
    letter: h
    label: Overall height reduced to 350 mm
    design_change: All linear dimensions scale with height (wall thicknesses and hole sizes stay the same).
    effect:
      scale_height: 350
    premium_impact: slight
    tradeoffs:
      finish: No change.
      weight: Lighter in proportion to size.
      premium: Less presence on a table; proportions are unchanged.
      lead_time: No change.
      tooling: Smaller forms, marginally cheaper.
  - key: dimmer_inline
    letter: j
    label: Inline cable dimmer instead of the in-base dimmer
    design_change: >-
      Replace the in-base rotary (or touch) dimmer with an inline dimmer on the cable:
      mains triac dimmer for option A (needs a triac-dimmable driver), low-voltage PWM
      dimmer for option B. The base loses the knob and its hole.
    effect:
      add_items:
        - {price_key: dimmer_inline_mains, quantity: 1}
      remove_items: [dimmer_in_base]
    premium_impact: slight
    flags:
      - {kind: compliance, message: "Inline dimmer must be certified for the cable and load in each market."}
    tradeoffs:
      finish: Cleaner base with no knob.
      weight: No change.
      premium: An inline dimmer on the cable feels less special than a control on the lamp.
      lead_time: Off-the-shelf.
      tooling: None.

# Premium brass edition: band and top cap in brass. Solid brass or real plating on
# the metal part only; brass-look coatings are not allowed (visible metal must be solid metal).
premium_edition:
  label: Premium brass edition
  parts: [band, top_cap]
  options:
    - key: plated
      label: Brass-plated band and top cap
      finish: brass_plating
    - key: solid
      label: Solid brass band and top cap (polished, clear lacquer)
      material: brass
      finish: polish
