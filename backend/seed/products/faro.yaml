# Faro product template. Seeds a new Faro project.
# Every value here is editable. Placeholder commercial inputs are listed in
# `assumed_fields` so the UI labels them as assumptions.

name: Faro
description: >-
  A premium decorative electrical table lamp inspired by a lighthouse. Smooth,
  sculptural and playful, influenced by mid-century Italian product design.
  Second product of Bathsheva London, after the Atelier speaker.

requirements:
  approx_dimensions: {height_mm: null, width_mm: null, depth_mm: null}  # TBD
  target_retail_price: {amount: 275, currency: GBP}                     # user, Oct 2026 (range 249–295)
  production_volume: null                                               # TBD
  target_unit_cost: {amount: null, currency: GBP}                       # TBD
  intended_markets: [UK, EU]
  power_type: undecided
  preferred_materials:
    - Aluminium main body
    - Painted / lacquered coloured aluminium sections
    - Possible brass or brass-plated details
    - Borosilicate glass lantern (no plastic on visible parts)
  preferred_finishes:
    - Coloured lacquer on aluminium
    - Black lacquer base
  functional_requirements:
    - Decorative table lamp with internal LED light source
    - Light emitted through a transparent lantern section
    - Stable on a table or shelf
  environmental_requirements:
    - Indoor, domestic use

assumed_fields:
  - approx_dimensions
  - production_volume
  - target_unit_cost
  - intended_markets

# One CAD body per part (cad_key must match the generator's body names).
# Traits: `hidden` marks functional parts that are never seen (they may be plastic or
# rubber); `visible_trim` marks bought-in parts with a visible metal element.
parts:
  - cad_key: base
    name: Base
    function: >-
      Spun aluminium shell that hides the weight plate, the dimmer and the cable entry;
      the lamp tube clamps it to the body.
    material_category: aluminium
    finish: Black lacquer
    traits: [axisymmetric, cosmetic, closed_top, thin_wall, needs_mass, mounting_holes, side_hole]
  - cad_key: main_body
    name: Main body
    function: Tapered lighthouse tower with a locating step for the band; the main visual surface of the lamp.
    material_category: aluminium
    finish: Coloured lacquer
    traits: [axisymmetric, cosmetic, thin_wall, open_both_ends]
  - cad_key: band
    name: Decorative band
    function: Straight ring cut from stock tube, sitting on the body's step like a lighthouse gallery stripe.
    material_category: aluminium
    finish: Coloured lacquer (contrast) or brass-plated
    traits: [axisymmetric, cosmetic, ring, short, open_both_ends]
  - cad_key: lantern
    name: Lantern
    function: Borosilicate glass tube that lets the LED light out, clamped between gaskets.
    material_category: clear_polymer_or_glass
    finish: Clear, optionally frosted inside
    traits: [axisymmetric, transparent, thin_wall, open_both_ends, near_heat_source]
    open_questions:
      - Clear or frosted (acid-etched or sand-blasted inside) glass?
  - cad_key: top_cap
    name: Top cap
    function: Spun domed roof of the lighthouse; clamps the lantern via the cap nut.
    material_category: aluminium
    finish: Coloured lacquer or brass-plated
    traits: [axisymmetric, cosmetic, closed_top, domed, thin_wall]
  - cad_key: led_module
    name: LED module and mounting
    function: >-
      LED plate on the body top (clamped by a threaded LED holder on the lamp tube) and the
      LED module around the tube inside the lantern.
    material_category: electrical
    finish: None (internal)
    traits: [electrical, heat_source, internal]
    open_questions:
      - Target brightness (lumens)? Colour temperature 2700K, CRI 90+, dimmable.
      - LED arrangement around the central tube (COB on a bracket, or a ring module) to agree with the supplier.
  - cad_key: cable
    name: Cable / power entry
    function: Brings power into the base through a strain-relief grommet; the cable then runs up the lamp tube.
    material_category: electrical
    finish: Cable colour to match
    traits: [electrical, user_accessible, strain_relief]
  - cad_key: dimmer
    name: Dimmer (in base)
    function: Rotary dimmer on the base with a solid metal knob (touch dimmer as an alternative).
    material_category: electrical
    finish: Knob in solid aluminium or brass, finish to match
    traits: [electrical, user_accessible, visible_trim]
  - cad_key: weight_plate
    name: Weight plate
    function: Laser-cut steel plate inside the base for stability; clamped by the lamp nut and screwed to rivet nuts so it can't rattle.
    material_category: bought_in
    material: Mild steel S275 (zinc plated)
    finish: Zinc plated
    traits: [hidden, needs_mass]
  - cad_key: lamp_tube
    name: Lamp tube
    function: Hollow M10x1 threaded tube running the full height; clamps the stack and carries the cable.
    material_category: bought_in
    finish: Zinc plated
    traits: [hidden]
  - cad_key: lamp_nut
    name: Lamp nut and washer
    function: Nut and washer under the weight plate that tighten the lamp tube.
    material_category: bought_in
    finish: Zinc plated
    traits: [hidden]
  - cad_key: cap_nut
    name: Cap nut (finial)
    function: Decorative domed nut on top of the cap; tightens the cap, lantern and gaskets.
    material_category: bought_in
    finish: Solid brass or aluminium, finish to match the cap
    traits: [visible_trim, user_accessible]
  - cad_key: gasket_lower
    name: Lantern gasket (lower)
    function: Silicone ring between the LED plate and the glass.
    material_category: bought_in
    finish: None
    traits: [hidden]
  - cad_key: gasket_upper
    name: Lantern gasket (upper)
    function: Silicone ring between the glass and the inside of the cap.
    material_category: bought_in
    finish: None
    traits: [hidden]

# How parts join. References fasteners.yaml keys.
joints:
  - between: [base, main_body]
    method: central_lamp_tube
    note: The body foot sits on the base; the lamp tube pulls the LED plate down so the body is clamped between plate and base.
  - between: [weight_plate, base]
    method: threaded_insert
    note: M4 screws through the plate into rivet nuts in the base shell stop it turning or rattling; the lamp nut clamps it.
  - between: [main_body, band]
    method: adhesive_bonding
    note: Ring slides down from the top and sits on the body step; bonded at the step.
  - between: [main_body, lantern]
    method: clamp_with_gasket
    note: Glass sits on the lower gasket on the LED plate.
  - between: [lantern, top_cap]
    method: clamp_with_gasket
    note: Cap nut on the lamp tube pulls the cap down onto the upper gasket.
  - between: [cable, base]
    method: strain_relief_grommet
    note: Cable passes through the base side hole with a strain-relief grommet.

# Project-level decisions that are still open.
open_decisions:
  - topic: power_type
    question: "Power: (A) internal mains dimmable driver, or (B) certified external low-voltage adapter with an internal DC-DC driver?"
    options: [mains, mains_external_adapter]
    impact: >-
      Changes the electronics, the cable, the compliance scope (B moves most of it to the
      adapter supplier) and whether the metal body needs earthing.

# Engineering decisions accepted by the user (Oct 2026), recorded on new projects.
decisions:
  - part: base
    process: metal_spinning
    material: al_1050
    reason: >-
      Spun aluminium base shell with an internal steel weight plate and rivet nuts: same look
      as a solid base at a fraction of the material and machining cost. Tip-over stability
      stays an open safety check.
  - part: band
    process: metal_tube_cut
    material: al_6063
    reason: >-
      Band as a straight ring cut from stock tube, sitting on a locating step in the body:
      keeps a separate contrasting part with a crisp shadow line, no tooling.
  - part: lantern
    process: glass_tube_cut
    material: borosilicate
    reason: >-
      Borosilicate glass tube cut to length (replaces acrylic): premium feel, scratch
      resistance, and it never yellows.
  - topic: construction
    chosen: {value: central_lamp_tube, scenario: lamp_tube}
    reason: >-
      Central threaded lamp tube construction: one tube clamps the whole stack, the cable
      runs inside it and no fixings show; replaces tapped holes in thin walls.

