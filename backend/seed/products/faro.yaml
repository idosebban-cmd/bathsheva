# Design-change scenarios for the Cost-down tab. Each is toggleable; `options`
# are alternatives the optimiser can choose between. Effects:
#   reroute:      {part, options: [{process, material, tooling?, label}]}  (tooling: override band, e.g. none for stock tube)
#   reroutes:     [{part, process, material}] several parts rerouted together (one option)
#   finishes:     {cad_key: finish key} finish overrides
#   add_items kind one_off: a one-off total (e.g. testing) shared over the batch
# edition: true  costed as its own edition next to the full-detail lamp; the optimiser never picks it
#   remove_part:  cad_key (or list) of parts removed from the product
#   add_items / remove_items: bought-in lines by price_key (quantity or quantity_param)
#   assembly_min: change to assembly minutes {low, high}
#   scale_height: new overall height (mm); other linear dimensions scale with it
# premium_impact: none | slight | significant (significant = changes the design's look)
# Power options shown side by side in the product view. Option B forces scenario g.
power_options:
  - key: A
    label: "A: cordless, 2 x 18650 rechargeable over USB-C"
    scenario: null
  - key: B
    label: "B: certified external 12 V adapter + internal DC-DC driver (no battery)"
    scenario: external_adapter

scenarios:
  - key: base_pressed
    letter: a
    label: Base pressed (deep drawn) instead of spun
    design_change: Same thin shell and weight plate; the shell is deep drawn in a press tool instead of spun.
    effect:
      reroute:
        part: base
        options:
          - {process: deep_drawing, material: al_1050, label: Pressed (deep drawn)}
    premium_impact: none
    flags:
      - {kind: safety, message: "Stability is safety-relevant: tip-over must be verified on the finished lamp with the weight plate fitted."}
    tradeoffs:
      finish: Pressed surface is very consistent and takes black lacquer well.
      weight: Same as the spun shell; the steel plate provides the mass.
      premium: Looks the same as the spun base.
      lead_time: Press tools 6–10 weeks.
      tooling: Press tool tens of thousands of pounds; only worth it at volume.
  - key: no_tower_windows
    letter: b
    label: No tower windows (shows what the windows cost)
    design_change: >-
      Leave out the five windows: no window laser-cutting, no opal diffuser tube and no
      tower light. The tower becomes a plain two-tone cone and only the lantern glows.
    effect:
      remove_part: [diffuser, tower_light]
      remove_items: [window_laser_cut, tower_light, silicone_gasket]
      assembly_min: {low: -4, high: -2}
    premium_impact: significant
    tradeoffs:
      finish: Plain tower; no masking of window edges.
      weight: About 0.13 kg lighter (no diffuser tube).
      premium: Loses the spiralling windows, one of Faro's signature details.
      lead_time: One process fewer (no window laser-cutting fixture).
      tooling: No laser fixture.
      runtime: Longer runtime (lantern LED only).
  - key: tower_tube
    letter: e
    label: Tower from straight stock aluminium tube
    design_change: >-
      Tower becomes a straight stock tube instead of a spun cone. This removes the
      lighthouse taper, which is a significant change to the design.
    effect:
      reroute:
        part: tower
        options:
          - {process: metal_tube_cut, material: al_6063, tooling: none, label: Stock tube}
    premium_impact: significant
    tradeoffs:
      finish: Tube surface is excellent; die lines may need light brushing.
      weight: Similar.
      premium: Loses the tapered lighthouse silhouette that defines Faro.
      lead_time: Stock tube in days.
      tooling: None.
  - key: external_adapter
    letter: g
    label: "Power option B: certified external 12 V adapter with an internal DC-DC driver (no battery)"
    design_change: >-
      Replace the battery, the USB-C charging board and the cable with a certified external
      12 V adapter, a low-voltage cable and an internal DC-DC constant-current driver for
      both LED channels. The rotary dimmer stays on the driver's dim input.
    effect:
      add_items:
        - {price_key: external_adapter_12v, quantity: 1}
        - {price_key: dc_dc_cc_driver, quantity: 1}
        - {price_key: lv_cable_switch, quantity: 1}
      remove_items: [battery_pack, charge_control_board, usb_c_cable]
      assembly_min: {low: -2, high: 0}
    premium_impact: slight
    flags:
      - {kind: compliance, message: "Adapter and DC-DC driver must be verified for compliance (electrical safety, EMC, ecodesign) in each market."}
    tradeoffs:
      finish: A cable entry replaces the USB-C port.
      weight: About 0.1 kg lighter (no cells).
      premium: Loses the cordless freedom that suits a decorative lamp; a plug-in adapter is common in design lighting.
      lead_time: Off-the-shelf parts; certification effort moves largely to the adapter supplier.
      tooling: None.
  - key: dimmer_touch
    letter: j
    label: Touch dimmer on the finial instead of the rotary knob
    design_change: >-
      Replace the rotary pot and brass knob with a capacitive touch sensor: touching the
      brass finial switches and dims. The tower loses the knob and its hole.
    effect:
      remove_part: knob
      add_items:
        - {price_key: touch_dimmer_board, quantity: 1}
      remove_items: [dimmer_rotary, knob_logo_engrave, knob_knurl]
    premium_impact: slight
    tradeoffs:
      finish: Cleaner tower with no knob.
      weight: No change.
      premium: Loses the tactile brass knob from the prototype; touch dimming is less obvious to a new user.
      lead_time: Off-the-shelf sensor.
      tooling: None.
  - key: custom_battery_pack
    letter: c
    label: Custom battery pack with its own certification testing
    design_change: >-
      Buy a custom 2 x 18650 pack (cheaper per unit, no test reports) instead of a pre-certified
      pack, and pay for UN38.3 and IEC 62133-2 testing once.
    effect:
      add_items:
        - {price_key: battery_pack_custom, quantity: 1}
        - {price_key: battery_pack_testing, quantity: 1, kind: one_off}
      remove_items: [battery_pack]
    premium_impact: none
    flags:
      - {kind: compliance, message: "Custom pack: UN38.3 and IEC 62133-2 must be passed before shipping or selling; allow 6–10 weeks for testing."}
    tradeoffs:
      finish: No change.
      weight: No change.
      premium: No change.
      lead_time: Adds 6–10 weeks of testing before launch.
      tooling: None; the testing is a one-off cost shared over the batch.
  - key: simplified_premium
    letter: s
    label: "Simplified premium: lacquered aluminium gallery, railing and lantern frame (brass finial, knob and nameplate only)"
    design_change: >-
      Gallery, railing and lantern frame in aluminium, lacquered to a colour matched to the cap
      (no brass), and the hidden cap spigot in aluminium. Only the finial, knob and nameplate stay
      brass. Same geometry; a different look.
    effect:
      reroutes:
        - {part: gallery, process: metal_spinning, material: al_1050}
        - {part: railing, process: photo_etching, material: al_5052}
        - {part: lantern_frame, process: cnc_turning_near_net, material: al_6061}
        - {part: cap_spigot, process: cnc_turning_near_net, material: al_6061}
      finishes: {gallery: wet_lacquer, railing: wet_lacquer, lantern_frame: wet_lacquer}
    premium_impact: significant
    conflicts: [railing_method]
    # Costed as its own edition next to the full-detail lamp, never picked by the optimiser.
    edition: true
    tradeoffs:
      finish: Colour-matched lacquer instead of brushed brass on the gallery, railing and frame.
      weight: About 0.1 kg lighter.
      premium: Less jewellery-like; the brass is reduced to the finial, knob and nameplate.
      lead_time: Same suppliers; lacquer instead of polishing.
      tooling: None.
  - key: railing_method
    letter: k
    label: Railing made another way
    design_change: The prototype's railing made as soldered brass wire (round posts) or as a lost-wax brass casting.
    effect:
      reroute:
        part: railing
        options:
          - {process: wire_forming, material: brass, label: "Soldered brass wire (round posts, like the prototype)"}
          - {process: investment_casting, material: brass, label: Lost-wax cast brass}
    premium_impact: none
    tradeoffs:
      finish: Wire is round like the prototype; casting needs fettling and polishing.
      weight: Casting is heavier (posts at least 1.5 mm).
      premium: All read as a brass railing at arm's length.
      lead_time: Wire 1–3 weeks; casting needs a wax tool (6–10 weeks).
      tooling: Wire needs a jig; casting a wax injection tool.

# Premium brass edition: cap and cream band in brass. Solid brass or real plating on
# the metal part only; brass-look coatings are not allowed (visible metal must be solid metal).
premium_edition:
  label: Premium brass edition
  parts: [band_cream, cap]
  options:
    - key: plated
      label: Brass-plated cream band and cap
      finish: brass_plating
    - key: solid
      label: Solid brass cream band and cap (polished, clear lacquer)
      material: brass
      finish: polish

# Supplier questions and the answers that now go into the RFQs (Oct 2026). `answer` is set
# once you have decided; open-questions.md and the Factory Pack tab list what is still open.
rfq_open_questions:
  - id: battery_config
    topic: Electronics
    question: "Battery pack configuration: 1S2P (3.6 V, 6.7 Ah) or 2S (7.2 V, 3.35 Ah)?"
    why: Sets the charger, the LED driver topology and which pre-certified packs fit.
    proposed: "1S2P: simplest 5 V USB-C charging and widest choice of certified packs; the RFQ asks suppliers to confirm or propose 2S."
    answer: "1S2P (3.6 V nominal); suppliers may propose 2S with reasons."
  - id: dimming
    topic: Electronics
    question: Do the lantern and tower lights dim together on the one knob, or does the tower stay at a fixed ratio?
    why: Defines the control board's channel behaviour.
    proposed: Both dim together from the knob; tower light at a fixed share of the lantern (ratio set at the factory).
    answer: Both dim together from the knob; the tower light is a fixed share of the lantern, set at the factory.
  - id: charge_indication
    topic: Electronics
    question: How is charging and low battery shown to the user?
    why: The control board and the base need an indicator (LED and light pipe, or a lantern blink).
    proposed: "No visible indicator on the lamp: the lantern blinks twice at low battery; a small LED by the USB-C port shows charging."
    answer: "The lantern blinks twice at low battery; a small LED by the USB-C port shows charging. No other indicator."
  - id: tolerances
    topic: Drawings
    question: Which general tolerance applies where a drawing gives none?
    why: The drawings said "tolerances to be agreed"; suppliers price to the tolerance.
    proposed: "ISO 2768-m for metal parts, ±0.5 mm on glass length and ±0.3 mm on glass OD; fits (bayonet, spigots) as dimensioned."
    answer: "ISO 2768-m for metal parts; glass ±0.5 mm on length and ±0.3 mm on OD; fits (bayonet, spigots) as dimensioned."
  - id: colours
    topic: Finish
    question: Exact colours and gloss for the black, cream and red lacquer, and the brass finish.
    why: Finishers need colour references and gloss levels to quote and match.
    proposed: "Send physical colour samples or RAL references; brass polished and clear-lacquered."
    answer: "Hex values from the prototype (black #121212, cream #F9F2E1) and Atelier (oxblood red #8A1C15), with the nearest RAL marked approximate (red: RAL 3011 and RAL 3002); physical colour samples are the master. Gloss: base satin 30–50 GU, cream and red 80+ GU. Brass brushed and clear-lacquered."
  - id: artwork
    topic: Nameplate
    question: Nameplate artwork (FARO lettering, font, fill colour).
    why: The etcher needs vector artwork to tool.
    proposed: Supply a vector file (SVG/DXF) of the lettering at 1:1 with the RFQ.
    answer: "Prototype lettering exported 1:1 as SVG and DXF (mechanical/artwork/); etched, filled black."
  - id: intended_markets
    topic: Compliance
    question: "Markets for launch: UK only, or UK and EU?"
    why: Sets the marking (UKCA / CE), plug types for option B and the battery regulations.
    proposed: UK and EU.
    answer: "UK only at launch: quote UKCA marking; CE for the EU may follow."
  - id: incoterms
    topic: Commercial
    question: Delivery terms, currency and delivery address.
    why: Quotes are not comparable without the same Incoterm and currency.
    proposed: "Quote FOB (port of loading) and DDP to a UK address, in GBP or USD."
    answer: "FOB (port of loading) and DDP to a UK address, in GBP or USD. The delivery address is a placeholder for you to fill in."
  - id: assembly
    topic: Commercial
    question: Who does final assembly, test and packing?
    why: Changes who quotes the electronics fitting, the bonding and the retail box.
    proposed: Ask each mechanical supplier whether they can offer final assembly; packaging quoted separately.
    answer: Each mechanical supplier is asked whether they can offer final assembly, test and packing; the retail box is quoted separately.
  - id: packaging
    topic: Packaging
    question: Retail box and shipping carton specification.
    why: Glass parts need protective packing.
    proposed: Ask for the supplier's standard protective packing now; brief the retail box separately.
    answer: Suppliers quote their standard protective packing now; the retail box is briefed separately.
  - id: adhesive
    topic: Assembly
    question: Which structural adhesive for the tower, gallery, frame and spigot bonds?
    why: Suppliers may propose their own; it affects cure time and long-term strength.
    proposed: Let suppliers propose (e.g. a two-part methacrylate or epoxy) with a pull-test on samples.
    answer: Suppliers propose the adhesive (e.g. two-part methacrylate or epoxy), proven by a pull-test on samples.
  - id: quality
    topic: Quality
    question: Inspection level (AQL) and who approves the golden sample.
    why: Suppliers price inspection into the part.
    proposed: "AQL 1.0 major / 2.5 minor for cosmetics; golden sample approved by you before production."
    answer: "AQL 1.0 major / 2.5 minor for cosmetics; golden sample approved by Bathsheva London before production."
  - id: production_volume
    topic: Commercial
    question: Likely first order.
    why: Suppliers ask which quantity you expect to order first.
    proposed: Say which quantity is the likely first order.
    answer: "300 to 500 lamps, depending on pre-orders; all three tiers (300, 500, 2,000) quoted."
  - id: electrical_data
    topic: Electronics
    question: LED wattages, cell capacity and the runtime estimate are model-generated.
    why: The runtime target (and the pack choice) depend on them.
    proposed: Keep them as UNVERIFIED targets in the RFQ; check against the suppliers' datasheets.
    answer: Kept as UNVERIFIED targets in the RFQ; checked against the suppliers' datasheets.

