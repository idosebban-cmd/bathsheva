# Surface finishes. `keywords` map free-text part finishes to a finish key.
# PROVENANCE: general knowledge written by an AI model. Not authoritative.

finishes:
  - key: gold_pvd
    name: Gold PVD (fine brushed satin)
    keywords: [pvd]
    plain_language: >-
      The metal part is brushed to a fine satin grain, then coated with a thin,
      very hard gold-coloured ceramic layer in a vacuum chamber (physical vapour
      deposition). It keeps its colour, resists wear and sweat far better than
      lacquer, and one coater can match the same gold across brass, zinc,
      aluminium and stainless parts.
    min_process_finish: good
    metallic_look: true
    notes: >-
      Needs a base layer: copper-nickel (or copper-nickel-chrome) on zinc die-castings, nickel on brass,
      a suitable pretreatment on aluminium. Engraving and knurling are cut before coating, so grooves come
      out gold too. Tone matched across parts (target ΔE <= 1.5).
    source: model-generated
    confidence: medium
    verified: false
  - key: gloss_lacquer_polished
    name: Polished gloss lacquer (primer, colour, two clear coats)
    keywords: [polished lacquer]
    plain_language: >-
      Primer, a solid colour coat and two clear coats, then cut and polished to a
      deep, mirror-like gloss (90 GU or more). Every mark in the part shows
      through, so the moulding has to be flawless.
    min_process_finish: good
    notes: On plastic, use a primer made for the substrate (adhesion tested to ISO 2409 class 0).
    source: model-generated
    confidence: medium
    verified: false
  - key: brushed_lacquer
    name: Brushed (satin), clear lacquered
    keywords: [brushed]
    plain_language: >-
      Solid brass brushed to a fine, even satin grain (abrasive belt, wheel or
      pad), then clear lacquered so it keeps its colour. Hides small marks and
      fingerprints better than a mirror polish; the grain direction must be
      consistent across parts.
    min_process_finish: fair
    metallic_look: true
    source: model-generated
    confidence: low
    verified: false
  - key: tumble_polish
    name: Tumble (barrel) polished, clear lacquered
    keywords: [tumble, barrel polish, vibratory]
    plain_language: >-
      Small solid metal parts polished in batches in a vibratory or barrel
      tumbler, then clear lacquered so the brass stays bright. Much cheaper per
      part than hand polishing, with a slightly softer shine.
    min_process_finish: fair
    metallic_look: true
    source: model-generated
    confidence: low
    verified: false
  - key: wet_lacquer
    name: Wet paint / lacquer
    keywords: [lacquer, paint, painted, coloured, colored]
    plain_language: >-
      Sprayed colour coat plus clear lacquer. Gives rich, glossy colours on
      aluminium; needs a smooth, well-prepared surface because every mark shows
      through gloss.
    min_process_finish: good
    notes: Needs pretreatment (etch primer or conversion coat) for adhesion on aluminium.
    source: model-generated
    confidence: medium
    verified: false
  - key: powder_coat
    name: Powder coating
    keywords: [powder]
    plain_language: Tough baked-on coating; very durable, slightly thicker and less crisp than wet lacquer.
    min_process_finish: fair
    source: model-generated
    confidence: medium
    verified: false
  - key: anodise
    name: Anodising
    keywords: [anodise, anodize, anodised, anodized]
    plain_language: Colour grown into the aluminium surface; very durable, metallic look. Works poorly on cast alloys.
    min_process_finish: good
    source: model-generated
    confidence: medium
    verified: false
  - key: polish
    name: Polished (clear coated)
    keywords: [polish, polished]
    plain_language: Polished bare metal under clear lacquer. Shows every defect and fingerprint.
    min_process_finish: excellent
    metallic_look: true
    source: model-generated
    confidence: medium
    verified: false
  - key: brass_plating
    name: Brass plating on aluminium
    keywords: [brass plating, brass-plated, brass plated]
    plain_language: >-
      Real brass plated onto an aluminium part. Needs special pretreatment
      (zincate) and a good plater; solid brass is the more reliable option.
    min_process_finish: good
    metallic_look: true
    notes: Plating adhesion on aluminium is a known risk; confirm with plater.
    source: model-generated
    confidence: low
    verified: false
  - key: clear
    name: Clear (as moulded / polished)
    keywords: [clear, transparent]
    plain_language: Left clear; edges and surfaces polished.
    min_process_finish: good
    source: model-generated
    confidence: medium
    verified: false
  - key: frosted
    name: Frosted / diffused
    keywords: [frost, frosted, diffuse, diffused, satin]
    plain_language: Sand-blasted, etched or diffuser-grade material that softens the light and hides the LED.
    min_process_finish: fair
    source: model-generated
    confidence: medium
    verified: false
  - key: metal_effect_paint
    name: Metal-effect paint or coating (not allowed on visible parts)
    keywords: [metal effect, metal-effect, metallic paint, brass effect, brass-effect, brass look, brass-look, chrome effect, metallised, metallized]
    plain_language: >-
      Paint or a vacuum-metallised film that imitates metal. Faro's design
      constraint forbids it on any visible part: visible metal must be solid metal.
    min_process_finish: fair
    metal_effect: true
    source: "user requirement (Oct 2026): visible metal parts must be solid metal"
    confidence: high
    verified: false
