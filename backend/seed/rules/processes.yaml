# Manufacturing processes: geometry suitability, economic volume range,
# tooling/unit cost category, finish quality, wall limits and trade-offs.
#
# PROVENANCE: values are general engineering knowledge written by an AI model.
# They are typical ranges, not supplier data. Verify with manufacturers and set
# `verified: true` (and a real `source`) only after checking.
#
# Fields:
#   material_categories  which part families the process applies to
#   requires_all         traits a part must have (else excluded)
#   excludes             traits that rule the process out
#   suits                traits that make the process a good fit (+1 each)
#   poor_fit             traits that make it a worse fit (-1 each)
#   volume               economic range in units (lifetime / per year order of magnitude)
#   tooling_cost         key into tooling_cost.yaml
#   unit_cost            low | medium | high (relative)
#   finish_quality       poor | fair | good | excellent (as-produced cosmetic quality)
#   wall_mm              practical wall thickness range

processes:
  - key: metal_spinning
    name: Metal spinning
    material_categories: [aluminium, brass]
    plain_language: >-
      A flat aluminium disc is spun on a lathe and pressed over a shaped form.
      Ideal for round, hollow, lamp-like shapes. Tooling is cheap (a wooden or
      steel form), so it suits small and medium batches.
    requires_all: [axisymmetric]
    excludes: [non_axisymmetric, transparent, electrical]
    suits: [thin_wall, domed, open_both_ends, closed_top, tapered]
    poor_fit: [mounting_holes, side_hole, needs_mass]
    volume: {min: 1, max: 5000}
    tooling_cost: low
    unit_cost: medium
    finish_quality: good
    wall_mm: {min: 0.5, max: 3.0, typical_min: 1.0, typical_max: 2.0}
    when_to_prefer: Round hollow parts from prototypes up to a few thousand units.
    risks:
      - Faint spin lines can show through glossy lacquer; parts usually need sanding or polishing before finishing.
      - Walls thin on steep tapers or deep shapes; ask the spinner what minimum wall they can hold.
      - Trimmed edges are sharp and must be deburred or rolled.
    source: model-generated
    confidence: medium
    verified: false

  - key: cnc_machining
    name: CNC machining
    material_categories: [aluminium, brass, clear_polymer_or_glass]
    plain_language: >-
      The part is cut from a solid block or bar by a computer-controlled
      machine. Very accurate with an excellent finish and no tooling cost, but
      each part is relatively expensive, especially if lots of material is
      removed.
    requires_all: []
    excludes: [electrical]
    suits: [ring, short, mounting_holes, side_hole, closed_top, needs_mass]
    poor_fit: [open_both_ends, thin_wall, transparent]
    volume: {min: 1, max: 500}
    tooling_cost: none
    unit_cost: high
    finish_quality: excellent
    wall_mm: {min: 1.0, max: 50.0, typical_min: 1.5, typical_max: 10.0}
    when_to_prefer: Prototypes, small batches, short or chunky parts, or features needing accuracy.
    risks:
      - Tall thin-walled hollow parts waste most of the bar and can vibrate while cutting.
      - Unit cost falls only slowly with volume.
    source: model-generated
    confidence: medium
    verified: false

  - key: sheet_forming
    name: Rolled and seam-welded sheet
    material_categories: [aluminium]
    plain_language: >-
      Flat sheet is rolled into a tube or cone and the seam is welded and
      dressed. Low tooling cost, but the seam needs careful finishing to be
      invisible under paint.
    requires_all: []
    excludes: [domed, closed_top, transparent, electrical]
    suits: [open_both_ends, thin_wall, ring, axisymmetric, tapered]
    poor_fit: [cosmetic]
    volume: {min: 50, max: 10000}
    tooling_cost: low
    unit_cost: medium
    finish_quality: fair
    wall_mm: {min: 0.8, max: 3.0, typical_min: 1.0, typical_max: 2.0}
    when_to_prefer: Tubes and cones in medium batches where a dressed seam is acceptable.
    risks:
      - The weld seam can show through a glossy finish.
      - Welding heat can distort thin walls and affect roundness.
    source: model-generated
    confidence: low
    verified: false

  - key: deep_drawing
    name: Deep drawing
    material_categories: [aluminium]
    plain_language: >-
      Sheet is pressed into a die to form a cup or dome shape in one or more
      strokes. Very cheap per part at high volume, but the press tools are
      expensive.
    requires_all: [axisymmetric]
    excludes: [transparent, electrical]
    suits: [closed_top, domed, thin_wall]
    poor_fit: [open_both_ends, tapered]
    volume: {min: 5000, max: 1000000}
    tooling_cost: high
    unit_cost: low
    finish_quality: good
    wall_mm: {min: 0.4, max: 3.0, typical_min: 0.8, typical_max: 2.0}
    when_to_prefer: Cup or dome shapes at volumes of several thousand and up.
    risks:
      - Tall parts need several drawing stages, which adds tooling.
      - Tooling cost only pays back at high volume.
    source: model-generated
    confidence: medium
    verified: false

  - key: die_casting
    name: High-pressure die casting
    material_categories: [aluminium]
    plain_language: >-
      Molten aluminium is injected into a steel mould. It can make complex
      shapes with bosses and holes built in, and is cheap per part, but the
      mould is very expensive and takes months to make.
    requires_all: []
    excludes: [transparent, electrical]
    suits: [mounting_holes, side_hole, needs_mass, closed_top]
    poor_fit: [thin_wall, open_both_ends]
    volume: {min: 3000, max: 1000000}
    tooling_cost: very_high
    unit_cost: low
    finish_quality: fair
    wall_mm: {min: 1.5, max: 6.0, typical_min: 2.0, typical_max: 4.0}
    when_to_prefer: Complex parts at high volume where tooling cost can be spread over many units.
    risks:
      - Porosity can show through high-gloss finishes; cast alloys anodise poorly.
      - Needs draft angles on all walls; tooling lead time is often 8–12 weeks.
    source: model-generated
    confidence: medium
    verified: false

  - key: zinc_die_casting
    name: Zinc die casting (hot chamber)
    material_categories: [zinc]
    plain_language: >-
      Molten zinc alloy (Zamak) is injected into a steel mould in a hot-chamber
      machine. Zinc flows into fine detail and thin walls, casts smooth enough to
      plate or PVD, and the moulds last much longer than aluminium ones. The mould
      is still a big one-off cost and takes weeks to make.
    requires_all: []
    excludes: [transparent, electrical]
    suits: [mounting_holes, side_hole, needs_mass, fine_detail, cosmetic, closed_top]
    poor_fit: [open_both_ends, thin_wall]
    volume: {min: 500, max: 1000000}
    tooling_cost: high
    unit_cost: low
    finish_quality: good
    wall_mm: {min: 0.6, max: 5.0, typical_min: 1.0, typical_max: 3.0}
    when_to_prefer: Small, heavy, detailed metal parts that will be plated or PVD-coated, from a few hundred units up.
    risks:
      - Porosity near the gate can blister under plating or PVD; ask for vacuum-assisted casting and a porosity spec on cosmetic faces.
      - Every wall needs draft; hollow parts need a core that can pull straight out.
      - Zamak needs a copper-nickel (or copper-nickel-chrome) base before decorative PVD.
    source: model-generated
    confidence: medium
    verified: false

  - key: injection_moulding
    name: Injection moulding (opaque plastic)
    material_categories: [polymer]
    plain_language: >-
      Plastic pellets are melted and injected into a steel mould. Cheap per part
      and very repeatable, with bosses, ribs and clips moulded in, but the mould
      costs tens of thousands of pounds and every undercut needs a slide or a
      collapsible core.
    requires_all: []
    excludes: [transparent, electrical, needs_mass]
    suits: [cosmetic, mounting_holes, fine_detail, side_hole, closed_top]
    poor_fit: [ring, short]
    volume: {min: 1000, max: 1000000}
    tooling_cost: very_high
    unit_cost: low
    finish_quality: good
    wall_mm: {min: 1.0, max: 4.0, typical_min: 1.5, typical_max: 3.0}
    when_to_prefer: Complex plastic housings in thousands of units, painted or lacquered when the look matters.
    risks:
      - A shell whose belly is wider than its openings can't come off a simple core; it needs a collapsible core or two welded halves.
      - Sink marks over thick ribs and bosses show through gloss lacquer; keep ribs under about 60% of the wall.
      - Weld lines and gate marks must be placed away from the visible faces or sanded before painting.
    source: model-generated
    confidence: medium
    verified: false

  - key: pu_vacuum_casting
    name: Polyurethane cast in silicone moulds (soft tooling)
    material_categories: [polymer]
    plain_language: >-
      A finished master pattern (3D-printed or machined) is cast round in
      silicone, and two-part polyurethane is poured into the silicone mould
      under vacuum. No steel tool, and undercuts come out of the flexible
      mould, but each mould makes only about 20 parts and every part is cast,
      cured and trimmed by hand.
    requires_all: []
    excludes: [transparent, electrical, needs_mass]
    suits: [cosmetic, fine_detail, side_hole, closed_top, mounting_holes]
    poor_fit: [ring]
    volume: {min: 1, max: 1000}
    tooling_cost: low
    unit_cost: high
    finish_quality: good
    wall_mm: {min: 1.0, max: 6.0, typical_min: 1.5, typical_max: 4.0}
    when_to_prefer: A first batch of a few hundred plastic housings, before paying for a steel mould.
    risks:
      - Each silicone mould lasts about 15–25 castings, so moulds are remade throughout the batch; colour and size drift slightly between moulds.
      - Polyurethane is less tough and less heat- and UV-resistant than moulded PC/ABS; check the drop test and the lacquer's adhesion (primer needed).
      - Bosses and screw seats are cast in or bonded in; threads need inserts.
    source: model-generated
    confidence: low
    verified: false

  - key: jesmonite_casting
    name: Jesmonite cast in silicone moulds (glass-fibre reinforced, soft tooling)
    material_categories: [composite]
    plain_language: >-
      Jesmonite (a water-based acrylic and mineral composite) is brushed and
      poured into a silicone mould round a finished master pattern, in layers
      with glass-fibre reinforcement, then demoulded, trimmed and dried. No
      steel tool and no solvents; metal inserts are cast in. Each mould makes
      about 20–30 parts, and every part is laid up by hand.
    requires_all: []
    excludes: [transparent, electrical]
    suits: [cosmetic, fine_detail, closed_top, needs_mass]
    poor_fit: [ring, thin_wall]
    volume: {min: 1, max: 1000}
    tooling_cost: low
    unit_cost: high
    finish_quality: good
    wall_mm: {min: 3.0, max: 15.0, typical_min: 4.0, typical_max: 8.0}
    when_to_prefer: A heavy, solid-feeling cast shell in a first batch of a few hundred, from a UK caster.
    risks:
      - Brittle compared with moulded plastic; a dropped part can crack or chip at the edges.
      - The surface is porous and alkaline; it needs a sealer and primer before a gloss lacquer will hold.
      - Thick walls take room from the inside; check the air volume and the fit of the internals.
      - Each silicone mould lasts about 20–30 casts; size and colour drift slightly between moulds.
    source: model-generated
    confidence: low
    verified: false

  - key: cnc_wood_turning
    name: CNC-turned and hollowed hardwood (two halves glued at the belly)
    material_categories: [wood]
    plain_language: >-
      Kiln-dried hardwood blanks are glued up, turned on a CNC lathe and hollowed
      in two halves, which are glued together at the widest point with a turned
      spigot joint. No moulds; openings, pads and insert holes are machined. Wood
      keeps moving with humidity, so joints and fits need room for it.
    requires_all: []
    excludes: [transparent, electrical]
    suits: [cosmetic, closed_top, axisymmetric]
    poor_fit: [thin_wall, ring]
    volume: {min: 1, max: 5000}
    tooling_cost: low
    unit_cost: high
    finish_quality: good
    wall_mm: {min: 3.0, max: 20.0, typical_min: 4.0, typical_max: 8.0}
    when_to_prefer: Small batches of a turned, round housing where real wood is part of the look or a lacquered shell without moulds.
    risks:
      - Wood moves with humidity (about 0.2–0.4% across the grain per 1% moisture change); seams and spigot fits need clearance or a flexible seal.
      - Thin walls can crack along the grain if knocked or dried too fast; choose straight-grained, kiln-dried stock.
      - Open grain telegraphs through gloss lacquer unless it is grain-filled.
    source: model-generated
    confidence: low
    verified: false

  - key: photo_etching_stainless
    name: Photo-etched stainless sheet (formed after etching)
    material_categories: [stainless]
    plain_language: >-
      A pattern is printed onto thin stainless sheet and the rest is chemically
      etched away, so fine perforations such as a speaker grille come out crisp
      and burr-free. The flat part is then pressed to its curve. Tooling is just a
      photo-tool plus a simple forming die.
    requires_all: [fine_detail]
    excludes: [closed_top, transparent, electrical, needs_mass]
    suits: [thin_wall, flat_pattern, cosmetic, perforated]
    poor_fit: [tapered]
    volume: {min: 10, max: 100000}
    tooling_cost: low
    unit_cost: low
    finish_quality: good
    wall_mm: {min: 0.1, max: 1.0, typical_min: 0.3, typical_max: 0.6}
    when_to_prefer: Fine perforated grilles and covers in stainless that will be formed and PVD-coated.
    risks:
      - Holes and webs must be at least the sheet thickness (about 1x t); finer features etch away or close up.
      - Forming a perforated sheet onto a double curve can distort the hole pattern near the edge; trial the forming die.
    source: model-generated
    confidence: medium
    verified: false


  - key: sand_casting
    name: Sand or gravity casting
    material_categories: [aluminium]
    plain_language: >-
      Molten aluminium is poured into a sand or simple metal mould. Cheap
      tooling and good for heavy parts, but the surface is rough and needs
      machining and filling before a premium finish.
    requires_all: []
    excludes: [transparent, electrical, thin_wall]
    suits: [needs_mass, closed_top, mounting_holes]
    poor_fit: [cosmetic]
    volume: {min: 1, max: 2000}
    tooling_cost: low
    unit_cost: medium
    finish_quality: poor
    wall_mm: {min: 4.0, max: 25.0, typical_min: 5.0, typical_max: 12.0}
    when_to_prefer: Heavy, chunky parts in low volume (e.g. a weighted base).
    risks:
      - Rough surface needs machining and filler before lacquer.
      - Larger dimensional variation than other processes.
    source: model-generated
    confidence: low
    verified: false

  - key: cnc_turning_near_net
    name: CNC turning from near-net stock (tube, ring blank or close-fitting bar)
    material_categories: [aluminium, brass]
    plain_language: >-
      The part is turned on a CNC lathe from stock that is already close to its
      shape: tube or a ring blank for rings, bar only just bigger than the part
      for small solid parts. Little metal is cut away, so it is much cheaper than
      machining from a solid block, with the same finish. Ring-and-bar assemblies
      (like a lantern frame) are turned rings with drawn bars soldered between them.
    requires_all: [axisymmetric]
    excludes: [transparent, electrical, domed, tapered]
    suits: [ring, short, open_both_ends, mounting_holes, side_hole]
    poor_fit: [thin_wall]
    volume: {min: 1, max: 20000}
    tooling_cost: none
    unit_cost: medium
    finish_quality: excellent
    wall_mm: {min: 0.8, max: 20.0, typical_min: 1.5, typical_max: 10.0}
    when_to_prefer: Rings, collars and small turned details, from samples to several thousand.
    risks:
      - Needs the right stock size (standard tube ODs and walls); ask the turner what they hold.
      - Soldered ring-and-bar frames need a jig so the bars are evenly spaced and square.
    source: model-generated
    confidence: medium
    verified: false

  - key: extrusion
    name: Extrusion (cut to length)
    material_categories: [aluminium]
    plain_language: >-
      Aluminium is pushed through a shaped die to make a long profile, which
      is cut to length. Very economical for straight tubes, but only works for
      parts with the same cross-section along their length.
    requires_all: [constant_section]
    excludes: [tapered, domed, closed_top, transparent, electrical]
    suits: [open_both_ends, thin_wall, ring]
    poor_fit: []
    volume: {min: 500, max: 1000000}
    tooling_cost: low
    unit_cost: low
    finish_quality: good
    wall_mm: {min: 1.0, max: 10.0, typical_min: 1.5, typical_max: 4.0}
    when_to_prefer: Straight tubes and rings; a standard tube size may need no die at all.
    risks:
      - Cannot make tapered or domed shapes without extra forming.
      - Faint die lines may need brushing or polishing.
    source: model-generated
    confidence: medium
    verified: false

  - key: metal_tube_cut
    name: Cut from stock aluminium tube
    material_categories: [aluminium]
    plain_language: >-
      A standard aluminium tube is cut to length on a saw or lathe, then the
      edges are faced and deburred. No tooling at all, but only stock
      diameters and wall thicknesses are available.
    requires_all: [axisymmetric, constant_section]
    excludes: [tapered, domed, closed_top, transparent, electrical]
    suits: [ring, short, open_both_ends]
    poor_fit: [thin_wall]
    volume: {min: 1, max: 100000}
    tooling_cost: none
    unit_cost: low
    finish_quality: good
    wall_mm: {min: 1.0, max: 6.0, typical_min: 1.5, typical_max: 3.0}
    when_to_prefer: Straight rings and sleeves that match a stock tube size.
    risks:
      - Only stock diameters and walls are available; check the tube list before fixing the ring size.
      - Cut faces need facing and a small chamfer to look crisp under lacquer.
    source: model-generated
    confidence: medium
    verified: false

  - key: polymer_tube_cut
    name: Cut and polished clear tube
    material_categories: [clear_polymer_or_glass]
    plain_language: >-
      A standard clear acrylic or polycarbonate tube is cut to length and the
      edges polished. No tooling, low cost, but limited to stock diameters
      and wall thicknesses.
    requires_all: [constant_section]
    excludes: [domed, closed_top, electrical]
    suits: [transparent, open_both_ends, thin_wall, axisymmetric]
    poor_fit: []
    volume: {min: 1, max: 5000}
    tooling_cost: none
    unit_cost: low
    finish_quality: good
    wall_mm: {min: 2.0, max: 6.0, typical_min: 2.5, typical_max: 4.0}
    when_to_prefer: Straight clear cylinders in low to medium volume.
    risks:
      - Only stock diameters and walls are available; check supplier sizes before fixing dimensions.
      - Cut edges must be polished to look premium.
    source: model-generated
    confidence: medium
    verified: false

  - key: injection_moulding_clear
    name: Injection moulding (clear polymer)
    material_categories: [clear_polymer_or_glass]
    plain_language: >-
      Clear plastic is injected into a polished steel mould. Excellent
      clarity and any shape, cheap per part, but the mould is very expensive.
    requires_all: []
    excludes: [electrical]
    suits: [transparent, domed, closed_top, axisymmetric]
    poor_fit: [open_both_ends]
    volume: {min: 5000, max: 1000000}
    tooling_cost: very_high
    unit_cost: low
    finish_quality: excellent
    wall_mm: {min: 1.5, max: 4.0, typical_min: 2.0, typical_max: 3.0}
    when_to_prefer: High volume, or shapes a stock tube cannot make.
    risks:
      - Flow and weld lines show clearly in transparent parts.
      - Highly polished mould surfaces add tooling cost.
    source: model-generated
    confidence: medium
    verified: false

  - key: photo_etching
    name: Photo-etched brass sheet (formed after etching)
    material_categories: [brass, aluminium]
    plain_language: >-
      A pattern is printed onto thin brass sheet and the rest is chemically
      etched away, leaving very fine, crisp parts such as railings and
      nameplates. The flat part is then rolled or bent to shape and soldered.
      Tooling is just a photo-tool, so it suits small batches.
    requires_all: [fine_detail]
    excludes: [closed_top, domed, transparent, electrical, needs_mass]
    suits: [thin_wall, ring, open_both_ends, flat_pattern, cosmetic]
    poor_fit: [tapered]
    volume: {min: 10, max: 100000}
    tooling_cost: low
    unit_cost: low
    finish_quality: good
    wall_mm: {min: 0.1, max: 1.5, typical_min: 0.3, typical_max: 0.8}
    when_to_prefer: Fine flat or rolled details (railings, grilles, nameplates) in brass.
    risks:
      - Etched edges have a slight bevel; very fine bars are fragile until soldered in place.
      - Rolling and soldering the seam of a ring needs a jig and a skilled hand.
    source: model-generated
    confidence: medium
    verified: false

  - key: investment_casting
    name: Investment (lost-wax) casting
    material_categories: [brass]
    plain_language: >-
      A wax copy of the part is coated in ceramic, the wax is melted out and
      molten brass is poured in. Gives fine detail in one piece, but needs a
      wax injection tool and finishing after casting.
    requires_all: []
    excludes: [transparent, electrical]
    suits: [fine_detail, short, ring, cosmetic]
    poor_fit: [thin_wall, open_both_ends]
    volume: {min: 100, max: 50000}
    tooling_cost: medium
    unit_cost: medium
    finish_quality: fair
    wall_mm: {min: 1.0, max: 20.0, typical_min: 1.5, typical_max: 6.0}
    when_to_prefer: Detailed brass parts in one piece at a few hundred units and up.
    risks:
      - Bars under about 1.5 mm may not fill; posts may need to be thicker than the prototype.
      - Cast surfaces need fettling and polishing before they look like turned brass.
    source: model-generated
    confidence: low
    verified: false

  - key: wire_forming
    name: Brass wire, formed and soldered
    material_categories: [brass]
    plain_language: >-
      Posts and rails are cut and bent from brass wire and soldered together
      on a jig. No tooling beyond the jig, but it is slow hand work.
    requires_all: [fine_detail]
    excludes: [closed_top, domed, transparent, electrical, needs_mass]
    suits: [ring, open_both_ends]
    poor_fit: [thin_wall]
    volume: {min: 1, max: 2000}
    tooling_cost: low
    unit_cost: high
    finish_quality: fair
    wall_mm: {min: 0.8, max: 3.0, typical_min: 1.2, typical_max: 2.0}
    when_to_prefer: Round-section railings in small batches.
    risks:
      - Labour-heavy; consistency depends on the solderer.
      - Solder joints need cleaning before polishing.
    source: model-generated
    confidence: low
    verified: false

  - key: glass_tube_cut
    name: Cut and finished glass tube
    material_categories: [clear_polymer_or_glass]
    plain_language: >-
      A borosilicate glass tube is cut to length and the edges ground or
      fire-polished. Feels premium and resists heat, but can break.
    requires_all: [constant_section]
    excludes: [domed, closed_top, electrical]
    suits: [transparent, open_both_ends, axisymmetric, near_heat_source]
    poor_fit: []
    volume: {min: 1, max: 100000}
    tooling_cost: none
    unit_cost: medium
    finish_quality: excellent
    wall_mm: {min: 1.5, max: 5.0, typical_min: 2.0, typical_max: 3.5}
    when_to_prefer: Premium feel and heat resistance with no tooling.
    risks:
      - Breakage risk in use and in transit; edges must be ground or fire-polished.
      - Heavier than polymer and needs protective packaging.
    source: model-generated
    confidence: medium
    verified: false

  - key: pressed_blown_glass
    name: Pressed or blown glass
    material_categories: [clear_polymer_or_glass]
    plain_language: >-
      Molten glass is pressed or blown into a mould. Good for domes and
      shaped glass at volume.
    requires_all: []
    excludes: [electrical, open_both_ends]
    suits: [transparent, domed, closed_top, axisymmetric]
    poor_fit: []
    volume: {min: 2000, max: 1000000}
    tooling_cost: high
    unit_cost: low
    finish_quality: good
    wall_mm: {min: 2.0, max: 6.0, typical_min: 2.5, typical_max: 4.0}
    when_to_prefer: Shaped glass (domes, closed forms) at volume.
    risks:
      - Mould cost and minimum order quantities are significant.
    source: model-generated
    confidence: low
    verified: false

  - key: bought_in
    name: Bought-in standard component
    material_categories: [electrical, bought_in]
    plain_language: >-
      Buy a standard, certified component from a specialist supplier rather
      than making it. Electrical parts in particular should come with the
      certification needed for the target markets.
    requires_all: []
    excludes: []
    suits: [electrical, internal, strain_relief, heat_source, user_accessible]
    poor_fit: []
    volume: {min: 1, max: 1000000}
    tooling_cost: none
    unit_cost: low
    finish_quality: good
    wall_mm: null
    when_to_prefer: Electrical and standard hardware parts.
    risks:
      - Check the supplier's certification and datasheet ratings for the target markets.
    source: model-generated
    confidence: high
    verified: false
