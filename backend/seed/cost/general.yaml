# General cost settings.
# PROVENANCE: model-generated assumptions. Replace with your own.

general:
  - key: labour_gbp_per_hr
    value: {low: 15, high: 25}
    plain_language: Hourly cost of assembly and packing labour (UK, fully loaded).
    source: model-generated
    confidence: low
    verified: false
  - key: confidence_spread
    value: {high: 0.0, medium: 0.10, low: 0.25}
    plain_language: >-
      How much each input's range is widened for its confidence: low-confidence
      inputs are stretched 25% beyond their stated range, medium 10%, high not at all.
    source: model-generated
    confidence: medium
    verified: false
  - key: volume_table
    value: [100, 500, 2000]
    plain_language: Production quantities shown in the cost-by-volume table.
    source: model-generated
    confidence: high
    verified: false
  - key: sensitivity_step
    value: 0.25
    plain_language: Each assumption is moved up and down by this fraction to rank its effect on unit cost.
    source: model-generated
    confidence: high
    verified: false
  # Volume discounts: distributor and retail prices are per piece at small quantities.
  # When costing at `from_quantity` or more, the researched price is multiplied by this
  # fraction (low–high). Editable per project on the Manufacturing tab.
  - key: volume_discount_electronics
    value: {low: 0.40, high: 0.60, from_quantity: 500}
    plain_language: >-
      Bought-in electronics bought direct or on an OEM price list at 500+ cost about
      40–60% of the small-quantity distributor price.
    source: "user assumption (Oct 2026)"
    confidence: medium
    verified: false
  - key: volume_discount_merchant_material
    value: {low: 0.50, high: 0.70, from_quantity: 500}
    plain_language: >-
      Material bought from a stockholder or mill at production volume costs about
      50–70% of the online merchant price for single sheets and bars.
    source: "user assumption (Oct 2026)"
    confidence: medium
    verified: false
