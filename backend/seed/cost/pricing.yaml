# Channel economics used to turn a retail price into target factory cost.
# PROVENANCE: typical rules of thumb written by an AI model. Replace with your own.

pricing:
  - key: vat_rate
    value: 0.20
    plain_language: UK VAT included in the retail price.
    source: model-generated
    confidence: high
    verified: false
  - key: dtc_factory_share
    value: 0.33
    plain_language: >-
      Selling direct, factory cost should be about a third of the ex-VAT price,
      leaving room for freight, duty, fulfilment, payment fees, marketing,
      returns and margin.
    source: model-generated
    confidence: low
    verified: false
  - key: retailer_margin
    value: 0.50
    plain_language: Through a retailer, the retailer keeps about half of the ex-VAT price.
    source: model-generated
    confidence: low
    verified: false
  - key: wholesale_factory_share
    value: 0.48
    plain_language: Of your wholesale price to the retailer, factory cost should be a little under half.
    source: model-generated
    confidence: low
    verified: false
  - key: close_band
    value: 0.15
    plain_language: A cost within 15% above target counts as "close" rather than "fail".
    source: model-generated
    confidence: medium
    verified: false

# DTC price stack (Cost-down tab): what sits between factory cost and the retail price when
# selling direct. The factory cost already includes the cost model's freight and duty line
# (factory to UK) and the one-off certification tests shared over the batch.
  - key: stack_freight
    value: 2.50
    plain_language: >-
      Inbound handling and warehouse storage per lamp in the UK (£), on top of the sea freight
      and duty already in the factory cost.
    source: model-generated
    confidence: low
    verified: false
  - key: stack_delivery
    value: 7.50
    plain_language: Courier delivery of one boxed lamp to the customer in the UK (£ per order).
    source: model-generated
    confidence: medium
    verified: false
  - key: stack_payment_pct
    value: 0.019
    plain_language: Card payment fee as a share of the price the customer pays (inc. VAT).
    source: model-generated
    confidence: medium
    verified: false
  - key: stack_payment_fixed
    value: 0.20
    plain_language: Fixed card payment fee per order (£).
    source: model-generated
    confidence: medium
    verified: false
  - key: stack_returns_pct
    value: 0.05
    plain_language: Returns, damage in transit and warranty repairs, as a share of the ex-VAT price.
    source: model-generated
    confidence: low
    verified: false
  - key: stack_marketing
    value: 30.0
    plain_language: Marketing spend needed to win one sale (£ per lamp sold).
    source: model-generated
    confidence: low
    verified: false
  - key: stack_one_off
    value: 5000.0
    plain_language: >-
      Other one-off launch costs (photography, samples, website), as a total in £ shared over the
      batch. Certification tests are already in the factory cost.
    source: model-generated
    confidence: low
    verified: false
  - key: stack_profit_pct
    value: 0.15
    plain_language: Profit you want to keep, as a share of the ex-VAT price.
    source: model-generated
    confidence: low
    verified: false
