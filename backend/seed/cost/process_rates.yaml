# Process cost rates. Every range is (low, high) and every quantity increases cost,
# so the cheapest estimate uses all lows and the dearest all highs.
#   machine_gbp_per_hr   machine + operator rate
#   setup_hours          per production batch; amortised over the batch quantity
#   cycle_min            minutes per part (fixed handling + forming / cutting)
#   cycle_min_per_kg     extra minutes per kg of finished part (bigger parts take longer)
#   material_utilisation kg bought per kg in the finished part (>= 1; trim, runners, breakage)
#   min_per_cm3_removed  CNC only: machining minutes per cm3 of stock removed
#   stock_allowance_mm   CNC only: extra stock on diameter and length (single value)
#   lead_time_weeks      tooling + first articles (for trade-off explanations; not costed)
# PROVENANCE: rough UK small-batch figures written by an AI model. Get real quotes.

process_rates:
  - process: metal_spinning
    machine_gbp_per_hr: {low: 35, high: 60}
    lead_time_weeks: {low: 2, high: 4}
    setup_hours: {low: 1.0, high: 3.0}
    cycle_min: {low: 4, high: 10}
